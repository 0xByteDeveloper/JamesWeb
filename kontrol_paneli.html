<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M2God Kontrol Paneli v4 — İçerik Otomasyonu (E193 · Python)</title>
<!--
  E193 · M2GOD KONTROL PANELİ v4 — İÇERİK OTOMASYONU (Python sunuculu)
  ═════════════════════════════════════════════
  (E186 paneli E177_resim-avif-v6'ya uyarlandı — E187 zinciri):
  · Toplu Sıkıştır / RKMP bölümü KALDIRILDI (canlı site paket tüketmiyor;
    istenirse E186 paketindeki panel geri getirilebilir)
  · ağaç arama + boyutlandırma (E183) · Verileri Temizle (E184) ·
    Metinler tek kaynak + otomatik çeviri (E185) AYNEN KORUNDU
  · Oyun kartındaki sürüm alanı ÜRÜNÜN (hile paketinin) sürümüdür —
    oyunun (Metin2 vb.) sürümü değil; etiket 'Ürün Sürümü' olarak netleşti
  Panel artık JSON EDİTÖRÜ değil, JSON ÜRETİCİSİDİR:
  · Sol ağaçta oyunlar + ürünler görünür; oyun/ürün ekle, sil, güncelle
  · Fiyat, paketler, parasal eğri, client, trailer, videolar, metinler…
    her şey formlardan yönetilir; JSON arka planda otomatik üretilir
  · JSON'u görmek isteyen "JSON'u Gör" çekmecesini açar (isteğe bağlı)
  · GitHub'dan çek / GitHub'a yükle / dosyadan yükle / JSON indir korunur
  Panel yalnız site_icerik.json ile çalışır; sitenin kendisine dokunmaz.
  Bilinmeyen anahtarlar (genişletilebilirlik) D objesinde aynen korunur.
-->
<style>
:root{
  --bg:#0b0e14;--panel:#121826;--panel2:#0d1320;--satir:#1a2233;
  --hat:#232c40;--yazi:#dbe2ef;--soluk:#8a93a6;--altin:#d9a441;
  --yesil:#3fb950;--kirmizi:#f85149;--amber:#d29922;--mavi:#58a6ff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--yazi);font:14px/1.5 'Segoe UI',system-ui,Arial,sans-serif;display:flex;flex-direction:column}
button{font:inherit;cursor:pointer;border:0;border-radius:6px;padding:7px 12px;background:var(--satir);color:var(--yazi)}
button:hover{filter:brightness(1.25)}
button.ana{background:var(--altin);color:#151006;font-weight:600}
button.tehlike{color:#ffb4ae;background:#3a1a1a}
button.kck{padding:3px 8px;font-size:12px;border-radius:5px}
input,select,textarea{font:inherit;background:var(--panel2);border:1px solid var(--hat);color:var(--yazi);border-radius:6px;padding:7px 9px;width:100%}
input:focus,select:focus,textarea:focus{outline:1px solid var(--altin)}
input[type=color]{padding:2px;height:36px;width:52px}
textarea{resize:vertical;min-height:60px}
label.aln{display:block;font-size:12px;color:var(--soluk);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.4px}
code{background:var(--panel2);border:1px solid var(--hat);border-radius:4px;padding:1px 5px;font-size:12px}

/* ── üst bar ── */
#ustbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--hat)}
#ustbar h1{font-size:16px;color:var(--altin);margin-right:6px}
#ustbar .bosluk{flex:1}
#durumCip{font-size:12px;color:var(--soluk);white-space:nowrap}
#durumCip b{color:var(--yesil)}

/* ── gövde ── */
#govde{flex:1;display:flex;min-height:0}
aside{width:300px;min-width:230px;background:var(--panel2);border-right:1px solid var(--hat);padding:10px;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;padding:16px 20px;min-width:0}
/* ── E183: ağaç arama + boyutlandırma ── */
#agacAramaKutu{display:flex;gap:4px;align-items:center;flex:0 0 auto;margin-bottom:8px}
#agacAramaKutu input{flex:1;min-width:0;font-size:13px}
#agac{flex:1;overflow-y:auto;min-height:0}
#agacSap{flex:0 0 7px;cursor:col-resize;background:transparent;touch-action:none;margin:0 -1px}
#agacSap:hover,#agacSap.surukle{background:var(--altin)}
.agVurgu{background:#3d2f10;color:var(--altin);border-radius:3px;padding:0 1px}
.agSatir .cevDurum{font-size:11px;color:var(--soluk)}

/* ── ağaç ── */
.agBaslik{display:flex;align-items:center;gap:6px;margin:14px 0 6px;font-size:12px;font-weight:700;letter-spacing:1px;color:var(--soluk);text-transform:uppercase}
.agBaslik:first-child{margin-top:2px}
.agBaslik .bosluk{flex:1}
.agSatir{display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:7px;cursor:pointer;border:1px solid transparent;margin-bottom:2px}
.agSatir:hover{background:var(--satir)}
.agSatir.secili{background:#221b0e;border-color:var(--altin)}
.agSatir .ad{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agSatir .muhur{font-size:11px;color:var(--soluk)}
.agSatir .arac{display:none;gap:2px}
.agSatir:hover .arac,.agSatir.secili .arac{display:flex}
.agUrunler{margin:2px 0 6px 22px;border-left:1px dashed var(--hat);padding-left:8px}
.bosNot{color:var(--soluk);font-size:12px;font-style:italic;padding:4px 9px}

/* ── form panelleri ── */
.fPanel{max-width:980px}
.fPanel h2{color:var(--altin);font-size:19px;margin-bottom:2px}
.fPanel .altYazi{color:var(--soluk);font-size:12px;margin-bottom:14px}
.izgara{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:0 14px}
.izgaraGenis{grid-template-columns:repeat(auto-fill,minmax(430px,1fr))}
.kutu{background:var(--panel);border:1px solid var(--hat);border-radius:10px;padding:14px 16px;margin-bottom:16px}
.kutu h3{font-size:13px;color:var(--altin);letter-spacing:.6px;text-transform:uppercase;margin-bottom:4px}
.kutu .ipucu{font-size:12px;color:var(--soluk);margin-bottom:8px}
.satirListe{display:flex;flex-direction:column;gap:6px}
.satirListe .oSatir{display:flex;gap:6px;align-items:center}
.satirListe .oSatir input[type=text],.satirListe .oSatir input[type=number]{flex:1}
.chkGrup{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}
.chkGrup label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--yazi);cursor:pointer}
.chkGrup input{width:auto}
.yatay{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.yatay>div{flex:1;min-width:120px}
.yatay input[type=color]{flex:0 0 52px;width:52px}
.yatay input[type=text]{flex:1;min-width:0}

/* ── sonuç listesi ── */
.sonuc{padding:8px 11px;border-radius:7px;margin-bottom:6px;font-size:13px;border:1px solid var(--hat)}
.sonuc.ok{background:#0f2315;border-color:#1f4d2a;color:#7ee2a0}
.sonuc.uyari{background:#2a230d;border-color:#5a4a17;color:#e7c56a}
.sonuc.hata{background:#2d1212;border-color:#5a2020;color:#ff9d95}

/* ── JSON çekmecesi ── */
#jsonCekmece{position:fixed;right:0;top:0;bottom:0;width:min(560px,60vw);background:var(--panel);border-left:1px solid var(--hat);z-index:50;display:none;flex-direction:column;box-shadow:-18px 0 40px rgba(0,0,0,.5)}
#jsonCekmece.acik{display:flex}
#jsonCekmece .baslik{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--hat)}
#jsonCekmece .baslik h3{flex:1;color:var(--altin);font-size:14px}
#jsonCekmece pre{flex:1;overflow:auto;padding:12px 14px;font:12px/1.45 Consolas,monospace;color:#c9d4e8;white-space:pre-wrap;word-break:break-word}

/* ── sekmeler (metinler grupları) ── */
.sekmeBar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.sekmeBar button.sec{background:#221b0e;color:var(--altin);border:1px solid var(--altin)}

/* ── E185: metinler katlanır dil ızgarası — satırda yalnız anahtar+kaynak+🔄+dol-sayacı; tüm diller açılır ızgarada ── */
.mSatir{margin:0 0 4px 0}
.mSatir .oSatir{margin-bottom:0}
.dilIzgara{display:none;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 14px;padding:7px 9px 9px 9px;margin-top:4px;border:1px dashed var(--hat);background:rgba(255,255,255,.025)}
.dilIzgara label{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--soluk);min-width:0}
.dilIzgara label span{min-width:22px;color:var(--altin);font-weight:600}
.dilIzgara label input{flex:1;min-width:0}
</style>
</head>
<body>
<div id="ustbar">
  <h1>⚙ M2God Kontrol Paneli</h1>
  <span id="durumCip">içerik yüklenmedi</span>
  <span class="bosluk"></span>
  <button id="bCek" title="GitHub raw'dan site_icerik.json TAZE çeker (E183: önbellek kırıcı — her seferinde güncel)">⬇ GitHub'dan Çek</button>
  <button id="bTemizle" title="Tarayıcıdaki YEREL verileri siler: taslak (localStorage) + arama filtresi + ekrandaki içerik (bellek). Bekleyen otomatik taslak kaydı da iptal edilir (E184). GitHub'daki veriye DOKUNMAZ; ardından güncel içerik taze çekilir">🧹 Verileri Temizle</button>
  <button id="bDosya" title="Bilgisayardan site_icerik.json yükler">📂 Dosyadan Yükle</button>
  <input type="file" id="dosyaGiris" accept=".json,application/json" style="display:none">
  <button id="bYukle" class="ana" title="Değişiklikleri GitHub'a push eder (zaman otomatik tazelenir)">⬆ GitHub'a Yükle</button>
  <button id="bIndir" title="Üretilen JSON'u dosya olarak indirir">💾 JSON İndir</button>
  <button id="bJson" title="Üretilen JSON'u görüntüle (isteğe bağlı)">👁 JSON'u Gör</button>
  <button id="bDogrula" title="İçerik doğrulaması çalıştır">✓ Doğrula</button>
  <button id="bGitHub" title="GitHub ayarları">🐙 Ayarlar</button>
</div>

<div id="githubAlani" style="display:none;background:var(--panel);border-bottom:1px solid var(--hat);padding:12px 14px">
  <div class="izgara">
    <div><label class="aln">Sahip (owner)</label><input id="ghSahip" type="text"></div>
    <div><label class="aln">Depo (repo)</label><input id="ghRepo" type="text"></div>
    <div><label class="aln">Dal (branch)</label><input id="ghDal" type="text" value="main"></div>
    <div><label class="aln">İçerik yolu</label><input id="ghYol" type="text" value="icerik/site_icerik.json"></div>
    <div style="grid-column:span 2"><label class="aln">Token (fine-grained PAT — yalnız bu tarayıcıda, localStorage'da tutulur; hiçbir dosyaya yazılmaz)</label>
      <input id="ghToken" type="password" placeholder="github_pat_…"></div>
  </div>
  <div class="yatay" style="margin-top:10px">
    <button id="ghKaydet" class="kck ana">Ayarları Kaydet</button>
    <span class="ipucu" style="color:var(--soluk);font-size:12px">Not: raw CDN yaklaşık 5 dk önbellekler; push sonrası sitede güncel verinin gelmesi 5 dk sürebilir. Public depoda token yalnız YÜKLEME (push) için gerekir — GitHub'dan Çek token'sız da çalışır.</span>
  </div>
  <div id="ghSonuc" style="margin-top:8px"></div>
</div>

<div id="govde">
  <aside id="agacKabuk">
    <div id="agacAramaKutu">
      <input id="agacArama" type="text" placeholder="🔍 oyun / ürün ara">
      <button id="agacAramaTemizle" class="kck" title="aramayı temizle" style="display:none">✕</button>
    </div>
    <div id="agac"></div>
  </aside>
  <div id="agacSap" title="tut & sürükle: genişlik · çift tık: sıfırla (E183)"></div>
  <main id="sahne"></main>
</div>

<div id="jsonCekmece">
  <div class="baslik">
    <h3>Üretilen JSON — site_icerik.json</h3>
    <button id="jsonKopyala" class="kck">Kopyala</button>
    <button id="jsonIndir2" class="kck">İndir</button>
    <button id="jsonKapat" class="kck tehlike">✕ Kapat</button>
  </div>
  <pre id="jsonOnIzleme">(boş)</pre>
</div>
<script>
"use strict";
/* ════════════════════════════════════════════════════════════════════
   E193 · KONTROL PANELİ v4 ÇEKİRDEĞİ (E186 tabanı, E177_resim-avif-v6'ya uyarlı)
   D = site_icerik.json dokümanı. Panel = D'nin görsel editörü.
   JSON her an D'den otomatik üretilir (JSON.stringify(D,null,2)).
   ════════════════════════════════════════════════════════════════════ */
var D=null;                              /* aktif doküman */
var secim={tur:'oyun',oyun:0,urun:0};    /* sahne seçimi */
var metinGrup=null;                      /* metinler sekmesi */
var agacAcik={};                         /* E183: ağaçta ürün listesi açık olan oyunlar (bağımsız durum) */
var agacArama='';                        /* E183: ağaç arama filtresi */
var metinAcik={};                        /* E185: metinler satırlarında diller ızgarası açık mı (anahtar→bool) */
var RESIMLER=['SiteLogo.png','metin2_logo.png','knight_logo.png','sro_logo.png','cabal_logo.png','ranonline_logo.png','rakion_logo.png','csgo_logo.png','m2god_logo.png','example_farmbot_logo.png','example_koxp_logo.png','example_farmbot_trailer.png','example_farmbot_client_1.png','example_farmbot_client_2.png','example_koxp_trailer.png','example_koxp_client_1.png','example_koxp_client_2.png','b1.png','b3.png','xxxx-img.png'];
var LS_TASLAK='kp2_taslak',LS_TOKEN='jw_gh_token',LS_CFG='jw_gh_cfg';
var taslakZam=null,agacZam=null,temizleModu=false;   /* E184: temizle sırasında otomatik taslak yazımı askıda */

/* ── küçük yardımcılar ── */
function $(x){return document.getElementById(x);}
function nSay(v){var n=parseFloat(String(v==null?'':v).replace(',','.'));return isNaN(n)?0:n;}
function nInt(v){return Math.round(nSay(v));}
function sGuven(v){return (v==null?'':String(v));}
function esc(s){return sGuven(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function saat(){var d=new Date();return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+':'+('0'+d.getSeconds()).slice(-2);}

/* ── doküman normalizasyonu: bilinen alanları garantiye al, yabancı anahtara dokunma ── */
function normalize(d){
  if(!d||typeof d!=='object')return null;
  d.sema=(d.sema||'epinsitesi-icerik');d.semaSurum=(d.semaSurum||'1.0');
  d.zaman=nInt(d.zaman)||Math.floor(Date.now()/1000);
  if(!d.site||typeof d.site!=='object')d.site={};
  d.site.ad=(d.site.ad||'M2God');
  if(!d.site.baslik||typeof d.site.baslik!=='object')d.site.baslik={};
  if(!d.site.logo||typeof d.site.logo!=='object')d.site.logo={};
  if(!d.metinler||typeof d.metinler!=='object')d.metinler={};
  if(!Array.isArray(d.oyunlar))d.oyunlar=[];
  d.oyunlar.forEach(function(o){
    if(!o||typeof o!=='object')return;
    if(!Array.isArray(o.urunler))o.urunler=[];
    if(!Array.isArray(o.rozetler))o.rozetler=[];
    if(!Array.isArray(o.versiyonlar))o.versiyonlar=[];
    if(!Array.isArray(o.ozellikler))o.ozellikler=[];
    o.urunler.forEach(function(u){
      if(!u||typeof u!=='object')return;
      if(!u.fiyat||typeof u.fiyat!=='object')u.fiyat={tutar:0,paraBirimi:'USD'};
      if(!Array.isArray(u.paketler))u.paketler=[];
      if(!Array.isArray(u.darksidePaketler))u.darksidePaketler=[];
      if(!Array.isArray(u.parasalEgri))u.parasalEgri=[];
      if(!u.client||typeof u.client!=='object')u.client={};
      if(!Array.isArray(u.client.fotolar))u.client.fotolar=[];
      if(!Array.isArray(u.client.ozellikler))u.client.ozellikler=[];
      if(!u.trailer||typeof u.trailer!=='object')u.trailer={};
    });
  });
  if(!d.videolar||typeof d.videolar!=='object')d.videolar={};
  if(!Array.isArray(d.videolar.sekmeler))d.videolar.sekmeler=[];
  if(!Array.isArray(d.videolar.videolar))d.videolar.videolar=[];
  if(!d.videolar.ikonlar||typeof d.videolar.ikonlar!=='object')d.videolar.ikonlar={};
  return d;
}
function taslakKaydet(){if(temizleModu)return;try{localStorage.setItem(LS_TASLAK,JSON.stringify(D));}catch(e){}}   /* E184: temizle askısındayken taslak YAZILMAZ */
function tazele(hep){
  $('durumCip').innerHTML='<b>'+D.oyunlar.length+' oyun</b> · '+
    D.oyunlar.reduce(function(t,o){return t+(o.urunler||[]).length;},0)+' ürün · '+
    (D.videolar.videolar||[]).length+' video · taslak '+saat();
  clearTimeout(taslakZam);taslakZam=setTimeout(taslakKaydet,600);
  if($('jsonCekmece').classList.contains('acik'))jsonCiz();
  clearTimeout(agacZam);agacZam=setTimeout(agacCiz,700);
}
function dokun(){tazele(false);}

/* ══════════ SOL AĞAÇ ══════════ */
function agacCiz(){
  var a=$('agac');a.innerHTML='';
  if(!D){var n0=document.createElement('div');n0.className='bosNot';n0.textContent='(içerik yok — üst çubuktan GitHub\'dan Çek ya da Dosyadan Yükle)';a.appendChild(n0);return;}   /* E184: D boşken ağaç hatasız temiz not göstersin */
  var q=agacArama.trim().toLowerCase();
  /* SITE */
  var h0=document.createElement('div');h0.className='agBaslik';h0.textContent='Site';a.appendChild(h0);
  var s0=agacSatir('🏛️',D.site.ad||'Site','',secim.tur==='site');
  s0.onclick=function(){secim={tur:'site'};sahneCiz();agacCiz();};
  a.appendChild(s0);
  /* OYUNLAR — E183: arama filtresi + tıkla-aç/tıkla-kapa */
  var h=document.createElement('div');h.className='agBaslik';
  h.innerHTML='<span>Oyunlar ('+D.oyunlar.length+')</span><span class="bosluk"></span>';
  var bEkle=document.createElement('button');bEkle.className='kck ana';bEkle.textContent='+ Oyun Ekle';
  bEkle.onclick=function(){oyunEkle();};
  h.appendChild(bEkle);a.appendChild(h);
  if(!D.oyunlar.length){var y=document.createElement('div');y.className='bosNot';y.textContent=q?'(eşleşen oyun yok)':'(oyun yok — + Oyun Ekle ile başla)';a.appendChild(y);}
  var eslesen=0;
  D.oyunlar.forEach(function(o,i){
    var urunler=o.urunler||[];
    var adEs=!q||sGuven(o.ad).toLowerCase().indexOf(q)>=0;
    var esU=[];
    urunler.forEach(function(u,j){if(!q||sGuven(u.ad).toLowerCase().indexOf(q)>=0)esU.push(j);});
    if(q&&!adEs&&!esU.length)return;
    eslesen++;
    var sat=agacSatir(o.ikon||'🎮',o.ad||'(adsız oyun)',urunler.length?(urunler.length+' ürün'):'ürün yok',secim.tur==='oyun'&&secim.oyun===i&&!secim.urunSabit);
    if(!q)sat.title='tık: seç + ürünleri aç · tekrar tık: ürünleri kapat (E183)';
    sat.onclick=function(){
      if(secim.tur==='oyun'&&secim.oyun===i){agacAcik[i]=!agacAcik[i];agacCiz();return;}
      secim={tur:'oyun',oyun:i};agacAcik[i]=true;sahneCiz();agacCiz();
    };
    var ar=sat.querySelector('.arac');
    ar.appendChild(aracBtn('↑',function(){oyunTasi(i,-1);}));
    ar.appendChild(aracBtn('↓',function(){oyunTasi(i,1);}));
    ar.appendChild(aracBtn('✕',function(){oyunSil(i);},'tehlike'));
    a.appendChild(sat);
    /* E183: aç/kapa artık seçimden bağımsız — ürün seçilince LİST AÇIK KALIR */
    if(agacAcik[i]||(q&&(adEs||esU.length))){
      var kapsa=document.createElement('div');kapsa.className='agUrunler';
      var hu=document.createElement('div');hu.className='agBaslik';
      hu.innerHTML='<span>Ürünler ('+(q&&!adEs?esU.length:urunler.length)+')</span><span class="bosluk"></span>';
      var bU=document.createElement('button');bU.className='kck ana';bU.textContent='+ Ürün Ekle';
      bU.onclick=function(){urunEkle(i);};
      hu.appendChild(bU);kapsa.appendChild(hu);
      if(!urunler.length){var y2=document.createElement('div');y2.className='bosNot';y2.textContent='(bu oyunun ürünü yok)';kapsa.appendChild(y2);}
      urunler.forEach(function(u,j){
        if(q&&!adEs&&esU.indexOf(j)<0)return;
        var et=(u.fiyat&&nSay(u.fiyat.tutar))?('$'+nSay(u.fiyat.tutar)):'—';
        var su=agacSatir('📦',u.ad||'(adsız ürün)',et,secim.tur==='urun'&&secim.oyun===i&&secim.urun===j);

        if(metinAcik[an]){metinAcik[yeni]=true;delete metinAcik[an];}
        G[yeni]=e;delete G[an];e.anahtar=yeni;an=yeni;dokun();};

      rozet.onclick=function(){metinAcik[an]=!metinAcik[an];if(izzgara)izzgara.style.display=metinAcik[an]?'grid':'none';satirTazele();};

    });
  }
  satCiz();
  var yb=document.createElement('button');yb.className='kck';yb.textContent='+ Anahtar Ekle';
  yb.onclick=function(){var n='yeni_anahtar';var i=2;while(G[n])n='yeni_anahtar'+(i++);
    G[n]={anahtar:n,degerler:{}};satCiz();dokun();};
  /* E183: grup çapında toplu çeviri */
  var tb=document.createElement('button');tb.className='kck';tb.textContent='🔄 Boşları Çevir';
  tb.title='Bu gruptaki TÜM satırlarda boş dil alanlarını otomatik çevirir (dolu değerler korunur). Kaynak: her satırda tr → en → ilk dolu.';
  tb.onclick=function(){cevirGrup(G,diller,tb);};
  /* E185: BÜTÜN gruplar tek tıkla */

  ha.title='BÜTÜN gruplardaki tüm satırlarda boş dil alanlarını otomatik çevirir (dolu değerler korunur). İlk doldurmada tek tık yeter.';
  ha.onclick=function(){cevirTumGruplar(M,diller,ha);};
  var ybK=document.createElement('div');ybK.className='yatay';ybK.style.marginTop='8px';
  ybK.appendChild(yb);ybK.appendChild(tb);ybK.appendChild(ha);k1.appendChild(ybK);

  yip.textContent='Diller: '+diller.join(', ')+'. Elle doldurma GEREKMEZ: tek dili yaz (tr) → 🔄 (satır) / 🔄 Boşları Çevir (grup) / 🔄 Tümünü Çevir (hepsi). Otomatik çeviri Python sunucusu (/api/cevir: Google → MyMemory yedeği) üzerinden yapılır — doldurulmayan alan kalmaz.';
  k1.appendChild(yip);
}

/* ══════════ E183: OTOMATİK ÇEVİRİ (/api/cevir) ══════════ */
function cevirKaynakSec(e,diller){
  var oncelik=['tr','en'],i,v;
  for(i=0;i<oncelik.length;i++){v=sGuven((e.degerler||{})[oncelik[i]]).trim();if(v)return{dil:oncelik[i],metin:v};}
  for(i=0;i<diller.length;i++){v=sGuven((e.degerler||{})[diller[i]]).trim();if(v)return{dil:diller[i],metin:v};}
  return null;
}
function cevirCagir(metin,kaynak,hedef){
  return fetch('/api/cevir',{method:'POST',cache:'no-store',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({metin:metin,kaynak:kaynak,hedef:hedef})})
  .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
  .then(function(x){
    if(!x.ok)throw new Error((x.j&&x.j.mesaj)||('HTTP '+x.ok));
    if(!x.j||!x.j.tamam)throw new Error((x.j&&x.j.mesaj)||'çeviri boş');
    return String(x.j.ceviri||'');
  });
}
function cevirSatir(e,diller,btn,tazele){
  var k=cevirKaynakSec(e,diller);
  if(!k){btn.textContent='kaynak yok';setTimeout(function(){btn.textContent='🔄';},2200);return;}
  var hedefler=diller.filter(function(dl){return dl!==k.dil&&!sGuven(e.degerler[dl]).trim();});
  if(!hedefler.length){btn.textContent='boş yok ✓';setTimeout(function(){btn.textContent='🔄';},2200);return;}
  btn.disabled=true;
  var yap=0,hata=0;
  var zincir=Promise.resolve();
  hedefler.forEach(function(dl){
    zincir=zincir.then(function(){
      return cevirCagir(k.metin,k.dil,dl)
      .then(function(c){e.degerler[dl]=c;yap++;btn.textContent=dl+' ✓';dokun();})
      .catch(function(){hata++;btn.textContent=dl+' ✗';});
    }).then(function(){return new Promise(function(z){setTimeout(z,150);});});
  });
  zincir.then(function(){
    /* satır girişlerini yerinde tazele — E185: katlanır ızgarada callback ile; eski düz satırda parentNode */
    if(tazele)tazele();
    else{var inp=btn.parentNode?btn.parentNode.querySelectorAll('input[type=text]'):[];
      diller.forEach(function(dl,ix){if(inp[ix+1])inp[ix+1].value=sGuven(e.degerler[dl]);});}
    btn.disabled=false;
    btn.textContent=hata?('🔄 '+yap+'✓/'+hata+'✗'):('✓ '+yap);
    setTimeout(function(){btn.textContent='🔄';},2600);
    dokun();
  });
}
function cevirGrup(G,diller,btn){
  var sira=[],toplam=0;
  Object.keys(G).forEach(function(an){
    var e=G[an];if(!e||typeof e!=='object'||!e.degerler)return;
    var k=cevirKaynakSec(e,diller);if(!k)return;
    var h=diller.filter(function(dl){return dl!==k.dil&&!sGuven(e.degerler[dl]).trim();});
    if(h.length){sira.push({e:e,kaynak:k,hedefler:h});toplam+=h.length;}
  });
  if(!sira.length){btn.textContent='boş yok ✓';setTimeout(function(){btn.textContent='🔄 Boşları Çevir';},2400);return;}
  btn.disabled=true;
  var yap=0,hata=0;
  btn.textContent='0/'+toplam;
  var zincir=Promise.resolve();
  sira.forEach(function(sr){
    zincir=zincir.then(function(){
      return sr.hedefler.reduce(function(p,dl){
        return p.then(function(){
          return cevirCagir(sr.kaynak.metin,sr.kaynak.dil,dl)
          .then(function(c){sr.e.degerler[dl]=c;yap++;dokun();})
          .catch(function(){hata++;});
        });
      },Promise.resolve())
      .then(function(){btn.textContent=yap+'/'+toplam;return new Promise(function(z){setTimeout(z,120);});});
    });
  });
  zincir.then(function(){
    btn.disabled=false;
    btn.textContent=hata?('🔄 '+yap+'✓/'+hata+'✗'):('✓ '+yap+' çeviri');
    setTimeout(function(){btn.textContent='🔄 Boşları Çevir';},3000);
    dokun();sahneCiz();
  });
}
/* ── E185: BÜTÜN grupları tek tıkla çevir — ilk doldurmada tek düğme yeter ── */
function cevirTumGruplar(M,diller,btn){
  var sira=[],toplam=0;
  Object.keys(M).forEach(function(gn){
    var G=M[gn];
    if(!G||typeof G!=='object')return;
    Object.keys(G).forEach(function(an){
      var e=G[an];if(!e||typeof e!=='object'||!e.degerler)return;
      var k=cevirKaynakSec(e,diller);if(!k)return;
      var h=diller.filter(function(dl){return dl!==k.dil&&!sGuven(e.degerler[dl]).trim();});
      if(h.length){sira.push({e:e,kaynak:k,hedefler:h});toplam+=h.length;}
    });
  });
  if(!sira.length){btn.textContent='boş yok ✓';setTimeout(function(){btn.textContent='🔄 Tümünü Çevir';},2400);return;}
  if(toplam>40&&!confirm(toplam+' dil alanı çevrilecek — kaynak sayısına göre birkaç dakika sürebilir.\nDevam edilsin mi?'))return;
  btn.disabled=true;
  var yap=0,hata=0;
  btn.textContent='0/'+toplam;
  var zincir=Promise.resolve();
  sira.forEach(function(sr){
    zincir=zincir.then(function(){
      return sr.hedefler.reduce(function(p,dl){
        return p.then(function(){
          return cevirCagir(sr.kaynak.metin,sr.kaynak.dil,dl)
          .then(function(c){sr.e.degerler[dl]=c;yap++;dokun();})
          .catch(function(){hata++;});
        });
      },Promise.resolve())
      .then(function(){btn.textContent=yap+'/'+toplam;return new Promise(function(z){setTimeout(z,120);});});
    });
  });
  zincir.then(function(){
    btn.disabled=false;
    btn.textContent=hata?('🔄 '+yap+'✓/'+hata+'✗'):('✓ '+yap+' çeviri');
    setTimeout(function(){btn.textContent='🔄 Tümünü Çevir';},3000);
    dokun();sahneCiz();
  });
}

/* ══════════ EKSİKLER (otomatik hesap) ══════════ */
function eksikleriHesapla(){
  var e={urunsuzOyunlar:[],clientBaslikYok:[],trailerKismiEksik:{},not:'Otomatik: ürünü olmayan oyunlar, client başlığı boş olan ürünler, trailer alanı eksik ürünler.'};
  (D.oyunlar||[]).forEach(function(o){
    if(!(o.urunler||[]).length)e.urunsuzOyunlar.push(o.ad);
    (o.urunler||[]).forEach(function(u){
      if(!sGuven((u.client||{}).baslik))e.clientBaslikYok.push(u.ad);
      var t=u.trailer||{},eks=[];
      if(!sGuven(t.term))eks.push('trailer-term');
      if(!sGuven(t.aciklama))eks.push('trailer-desc');
      if(eks.length)e.trailerKismiEksik[u.ad]=eks;
    });
  });
  if(!e.trailerKismiEksik||!Object.keys(e.trailerKismiEksik).length)delete e.trailerKismiEksik;
  return e;
}
function renderEksikler(){
  var s=$('sahne');
  var p=document.createElement('div');p.className='fPanel';s.appendChild(p);
  p.innerHTML='<h2>🧩 Eksikler</h2><div class="altYazi">JSON\'daki "eksikler" bölümü her kayıtta otomatik hesaplanır ve güncellenir — elle düzenlemeye gerek yok.</div>';
  var k=document.createElement('div');k.className='kutu';p.appendChild(k);
  var e=eksikleriHesapla();
  k.innerHTML='<h3>Otomatik Rapor</h3>'+
    '<div class="sonuc '+(e.urunsuzOyunlar.length?'uyari':'ok')+'">Ürünsüz oyunlar: <b>'+esc(e.urunsuzOyunlar.join(', ')||'yok')+'</b></div>'+
    '<div class="sonuc '+(e.clientBaslikYok.length?'uyari':'ok')+'">Client başlığı boş ürünler: <b>'+esc(e.clientBaslikYok.join(', ')||'yok')+'</b></div>'+
    '<div class="sonuc '+(Object.keys(e.trailerKismiEksik||{}).length?'uyari':'ok')+'">Trailer alanı eksik ürünler: <b>'+esc(Object.keys(e.trailerKismiEksik||{}).join(', ')||'yok')+'</b></div>';
  var b=document.createElement('button');b.className='kck';b.textContent='Eksikleri Şimdi JSON\'a Yaz';
  b.onclick=function(){D.eksikler=eksikleriHesapla();dokun();sonucYaz($('sahne'),'Eksikler JSON\'a yazıldı.','ok');};
  k.appendChild(b);
}
function sonucYaz(kapsa,metin,tur){
  var d=document.createElement('div');d.className='sonuc '+(tur||'ok');d.textContent=metin;
  kapsa.insertBefore(d,kapsa.firstChild);
  setTimeout(function(){if(d.parentNode)d.parentNode.removeChild(d);},4000);
}

/* ══════════ JSON ÇEKMECESİ ══════════ */
function jsonCiz(){
  try{$('jsonOnIzleme').textContent=JSON.stringify(D,null,2);}catch(e){$('jsonOnIzleme').textContent='JSON üretilemedi: '+e;}
}
function jsonAc(){jsonCiz();$('jsonCekmece').classList.add('acik');}
function jsonKapatFn(){$('jsonCekmece').classList.remove('acik');}
function jsonIndir(){
  if(!D)return;
  var blob=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='site_icerik.json';document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},300);
}
</script>
<script>
"use strict";
/* ══════════ GITHUB ══════════ */
function ghCfg(){
  return {sahip:$('ghSahip').value.trim(),repo:$('ghRepo').value.trim(),
    dal:$('ghDal').value.trim()||'main',yol:$('ghYol').value.trim()||'icerik/site_icerik.json'};
}
function ghCfgKaydet(){
  var c=ghCfg();
  try{localStorage.setItem(LS_CFG,JSON.stringify(c));}catch(e){}
  try{localStorage.setItem('epin_gh_taban','https://raw.githubusercontent.com/'+c.sahip+'/'+c.repo+'/'+c.dal);}catch(e){}
  try{var t=$('ghToken').value.trim();if(t)localStorage.setItem(LS_TOKEN,t);}catch(e){}
  ghSonuc('Ayarlar kaydedildi (token bu tarayıcıda kalır; site çekim tabanı da güncellendi).','ok');
}
function ghSonuc(metin,tur){
  $('ghSonuc').innerHTML='<div class="sonuc '+(tur||'ok')+'">'+esc(metin)+'</div>';
  /* E184: GitHub ayarları paneli kapalıyken sonuç/hata üst çipte de görünsün — mesaj görünmez alana düşmesin */
  try{
    var ga=$('githubAlani');
    if(ga&&ga.style.display==='none'){
      var r=(tur||'ok'),rk=(r==='hata')?'#ff9d95':((r==='uyari')?'#e7c56a':'#7ee2a0');
      $('durumCip').innerHTML='<span style="color:'+rk+'">'+esc(metin)+'</span>';
    }
  }catch(e){}
}
function ghRawUrl(){
  var c=ghCfg();
  return 'https://raw.githubusercontent.com/'+c.sahip+'/'+c.repo+'/'+c.dal+'/'+c.yol;
}
function ghApiUrl(){
  var c=ghCfg();
  return 'https://api.github.com/repos/'+c.sahip+'/'+c.repo+'/contents/'+c.yol+'?ref='+c.dal;
}
function ghCek(){
  if(!ghCfg().sahip||!ghCfg().repo){ghSonuc('GitHub ayarları eksik — Ayarlar bölümünü doldurun.','hata');return;}
  ghSonuc('GitHub\'dan TAZE çekiliyor… (E183: önbellek kırıcı aktif — tarayıcı + raw CDN eski kopya kullanmaz)');
  fetch('/api/gh/icerik?t='+Date.now(),{cache:'no-store'})
  .then(function(r){if(!r.ok)throw new Error('BEK-'+r.status);return r.text();})
  .catch(function(){return fetch(ghRawUrl()+'?t='+Date.now(),{cache:'no-store'})
  .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text();});})
  .then(function(t){
    var j=null;try{j=JSON.parse(t);}catch(e){throw new Error('JSON parse hatası: '+e);}
    if(!j||j.sema!=='epinsitesi-icerik')throw new Error('sema "epinsitesi-icerik" değil — bu dosya site içeriği değil.');
    D=normalize(j);metinGrup=null;
    secim={tur:'oyun',oyun:0,urun:0};
    agacAcik={0:true};   /* E183: ilk oyunun ürünleri açık gelsin */
    agacArama='';var ai=$('agacArama');if(ai)ai.value='';var at=$('agacAramaTemizle');if(at)at.style.display='none';
    temizleModu=false;   /* E184: temizle askısı bitti — taze veri taslak olarak yazılabilir */
    dokun();sahneCiz();agacCiz();
    ghSonuc('GitHub\'dan TAZE yüklendi ('+t.length+' bayt'+(j.zaman?(' · içerik zamanı: '+new Date(j.zaman*1000).toLocaleString()):'')+') — güncel veri bu.','ok');
  })
  .catch(function(e){temizleModu=false;ghSonuc('Çekme hatası: '+e.message,'hata');});   /* E184: askı kalkar, hata çipte görünür */
}
function ghYukle(){
  if(!D){ghSonuc('İçerik yok — önce yükle veya oluştur.','hata');return;}
  var t=$('ghToken').value.trim();
  if(!t){ghSonuc('Token boş — Ayarlar bölümüne github_pat_… yazın.','hata');return;}
  var c=ghCfg();
  if(!c.sahip||!c.repo){ghSonuc('GitHub ayarları eksik.','hata');return;}
  /* E174 dersi: her push'ta zaman otomatik tazelenir — site "eski veri" sayıp reddetmesin */
  D.zaman=Math.floor(Date.now()/1000);
  D.olusturma=new Date().toISOString();
  if(D.eksikler)D.eksikler=eksikleriHesapla();
  ghSonuc('Push ediliyor (zaman '+D.zaman+' tazelendi)…');
  var govde=JSON.stringify(D,null,2);
  fetch(ghApiUrl(),{headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+t}})
  .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
  .then(function(x){
    var putGovde={message:'site_icerik.json — M2God kontrol paneli (E193) '+new Date().toISOString(),
      content:btoa(unescape(encodeURIComponent(govde))),branch:c.dal};
    if(x.ok&&x.j&&x.j.sha)putGovde.sha=x.j.sha;
    return fetch('https://api.github.com/repos/'+c.sahip+'/'+c.repo+'/contents/'+c.yol,{
      method:'PUT',
      headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+t,'Content-Type':'application/json'},
      body:JSON.stringify(putGovde)});
  })
  .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
  .then(function(x){
    if(!x.ok){var ms=(x.j&&x.j.message)||('HTTP '+x.ok);throw new Error(ms);}
    ghSonuc('Push tamam: '+(x.j.commit&&x.j.commit.sha?x.j.commit.sha.slice(0,7):'commit')+' — raw CDN ~5 dk içinde güncellenir.','ok');
    dokun();
  })
  .catch(function(e){ghSonuc('Yükleme hatası: '+e.message+' (token izinleri: Contents: write olmalı; depo erişimi doğru mu?)','hata');});
}
function dosyaYukleFn(dosya){
  var oku=new FileReader();
  oku.onload=function(){
    try{
      var j=JSON.parse(String(oku.result));
      if(!j||j.sema!=='epinsitesi-icerik')throw new Error('sema "epinsitesi-icerik" değil');
      D=normalize(j);metinGrup=null;secim={tur:'oyun',oyun:0,urun:0};
      agacAcik={0:true};   /* E183 */
      dokun();sahneCiz();agacCiz();
      sonucYaz($('sahne'),'Dosyadan yüklendi: '+dosya.name,'ok');
    }catch(e){alert('Dosya yüklenemedi: '+e.message);}
  };
  oku.readAsText(dosya);
}

/* ══════════ DOĞRULAMA ══════════ */
function dogrula(){
  if(!D){alert('İçerik yok — önce yükle veya oluştur.');return;}
  var s=$('sahne');s.innerHTML='';
  var p=document.createElement('div');p.className='fPanel';
  p.innerHTML='<h2>✓ Doğrulama</h2><div class="altYazi">Üretilen JSON\'un site tarafından okunabilirliği kontrol edilir.</div>';
  s.appendChild(p);
  var R=[];
  function ekle(tur,m){R.push([tur,m]);}
  ekle(D.sema==='epinsitesi-icerik'?'ok':'hata','sema: '+sGuven(D.sema));
  ekle(nInt(D.zaman)>0?'ok':'hata','zaman: '+sGuven(D.zaman));
  ekle((D.oyunlar||[]).length?'ok':'uyari','oyunlar: '+(D.oyunlar||[]).length+' adet');
  (D.oyunlar||[]).forEach(function(o,i){
    if(!sGuven(o.ad))ekle('hata','oyun['+i+']: ad boş');
    (o.urunler||[]).forEach(function(u,j){
      var yol='oyun['+sGuven(o.ad)+'] ürün['+sGuven(u.ad)+']';
      if(!sGuven(u.ad))ekle('hata',yol+': ad boş');
      if(!(u.fiyat&&nSay(u.fiyat.tutar)>0)&&!(u.paketler||[]).length)
        ekle('uyari',yol+': fiyat 0 ve paket yok');
      (u.paketler||[]).forEach(function(pk,k){
        if(!sGuven(pk.ad)||nSay(pk.gun)<=0||nSay(pk.fiyat)<=0)
          ekle('hata',yol+' paket['+k+']: ad/gün/fiyat eksik');
      });
      if(u.trailer&&!sGuven(u.trailer.term)&&!sGuven(u.trailer.aciklama))
        ekle('uyari',yol+': trailer term/desc boş');
    });
  });
  var vids=(D.videolar&&D.videolar.videolar)||[];
  ekle(vids.length?'ok':'uyari','videolar: '+vids.length+' adet');
  vids.forEach(function(v,i){if(!sGuven(v.link))ekle('uyari','video['+i+'] ('+sGuven(v.baslik)+'): link boş — site placeholder gösterir');});
  var grp=Object.keys(D.metinler||{});var anahtarSay=0;
  grp.forEach(function(g){anahtarSay+=Object.keys(D.metinler[g]).length;});
  ekle('ok','metinler: '+grp.length+' grup / '+anahtarSay+' anahtar');
  var e=D.eksikler||{};
  if(e.urunsuzOyunlar&&e.urunsuzOyunlar.length)ekle('uyari','eksikler.urunsuzOyunlar: '+e.urunsuzOyunlar.join(', '));
  R.forEach(function(x){
    var d=document.createElement('div');d.className='sonuc '+x[0];d.textContent=x[1];p.appendChild(d);
  });
  var oz=document.createElement('div');oz.className='sonuc ok';
  oz.textContent='ÖZET: '+R.filter(function(x){return x[0]==='ok';}).length+' ok · '+
    R.filter(function(x){return x[0]==='uyari';}).length+' uyarı · '+
    R.filter(function(x){return x[0]==='hata';}).length+' hata';
  p.insertBefore(oz,p.children[1]||null);
}

/* ══════════ BOOT ══════════ */
function bagla(){
  $('bCek').onclick=function(){ghCek();};
  /* ── E183: ağaç arama (oyun + ürün) ── */
  $('agacArama').oninput=function(){agacArama=this.value;$('agacAramaTemizle').style.display=(agacArama?'':'none');agacCiz();};
  $('agacAramaTemizle').onclick=function(){agacArama='';$('agacArama').value='';this.style.display='none';agacCiz();};
  /* ── E183: ağaç genişliği — tut & sürükle (localStorage'lı) ── */
  (function(){
    var sap=$('agacSap'),kabuk=document.querySelector('aside'),suru=false;
    try{var g=parseInt(localStorage.getItem('kp2_agacGen')||'',10);
      if(g>=200&&g<=Math.floor(window.innerWidth*0.6))kabuk.style.width=g+'px';}catch(e){}
    sap.addEventListener('pointerdown',function(e){
      suru=true;sap.classList.add('surukle');
      if(sap.setPointerCapture)try{sap.setPointerCapture(e.pointerId);}catch(x){}
      document.body.style.cursor='col-resize';document.body.style.userSelect='none';
      e.preventDefault();});
    sap.addEventListener('pointermove',function(e){
      if(!suru)return;
      var w=Math.min(Math.max(e.clientX,200),Math.floor(window.innerWidth*0.6));
      kabuk.style.width=w+'px';});
    function bitir(){
      if(!suru)return;suru=false;sap.classList.remove('surukle');
      document.body.style.cursor='';document.body.style.userSelect='';
      try{localStorage.setItem('kp2_agacGen',String(parseInt(kabuk.style.width,10)||300));}catch(e){}}
    sap.addEventListener('pointerup',bitir);
    sap.addEventListener('pointercancel',bitir);
    sap.addEventListener('dblclick',function(){kabuk.style.width='300px';try{localStorage.removeItem('kp2_agacGen');}catch(e){}});
  })();
  /* ── E184: verileri temizle — taslak GERİ DİRİLMEZ (yalnız YEREL, GitHub'a dokunmaz) ──
     E183 hatası: yalnız localStorage siliniyordu; (a) bekleyen 600ms'lik otomatik kayıt eski D'yi
     geri yazabiliyor, (b) bellekteki D hiç boşaltılmıyordu → ghCek başarısızsa eski veri ekranda
     kalıyordu ve sonraki otomatik kayıt taslağı diriltiyordu, (c) hata mesajı display:none alana
     yazıldığı için kullanıcı hiçbir şey olmamış gibi görüyordu. Üçü de kapatıldı. */
  $('bTemizle').onclick=function(){
    if(!confirm('Tarayıcıdaki YEREL veriler temizlenecek (E184):\n· panel taslağı (localStorage)\n· arama filtresi\n· ekrandaki içerik (bellek)\n· bekleyen otomatik taslak kaydı iptal edilir\n\nGitHub\'daki veriye DOKUNULMAZ — yalnız bu tarayıcının eski kopyası silinir.\nSonrasında güncel içerik GitHub\'dan TAZE çekilecek. Onaylıyor musunuz?'))return;
    temizleModu=true;                        /* otomatik taslak yazımı askıya alınır */
    clearTimeout(taslakZam);                 /* bekleyen eski kayıt İPTAL — taslak dirilmesin */
    try{localStorage.removeItem(LS_TASLAK);}catch(e){}
    agacArama='';$('agacArama').value='';$('agacAramaTemizle').style.display='none';
    D=null;metinGrup=null;secim={tur:'oyun',oyun:0,urun:0};agacAcik={};   /* bellek de boşalır — ekran anında temizlenir */
    sahneCiz();agacCiz();
    ghCek();
  };
  $('bDosya').onclick=function(){$('dosyaGiris').click();};
  $('dosyaGiris').onchange=function(){if(this.files&&this.files[0])dosyaYukleFn(this.files[0]);this.value='';};
  $('bYukle').onclick=function(){ghYukle();};
  $('bIndir').onclick=function(){jsonIndir();};
  $('bJson').onclick=function(){jsonAc();};
  $('bDogrula').onclick=function(){dogrula();};
  $('bGitHub').onclick=function(){
    var a=$('githubAlani');a.style.display=(a.style.display==='none'?'block':'none');};
  $('ghKaydet').onclick=function(){ghCfgKaydet();};
  $('jsonKapat').onclick=function(){jsonKapatFn();};
  $('jsonKopyala').onclick=function(){
    var t=$('jsonOnIzleme').textContent;
    if(navigator.clipboard)navigator.clipboard.writeText(t).then(function(){},function(){});
    $('jsonKopyala').textContent='Kopyalandı ✓';
    setTimeout(function(){$('jsonKopyala').textContent='Kopyala';},1500);
  };
  $('jsonIndir2').onclick=function(){jsonIndir();};
  /* GitHub ayarlarını geri yükle */
  try{
    var c=JSON.parse(localStorage.getItem(LS_CFG)||'null');
    if(c){$('ghSahip').value=c.sahip||'';$('ghRepo').value=c.repo||'';
      $('ghDal').value=c.dal||'main';$('ghYol').value=c.yol||'icerik/site_icerik.json';}
    else{$('ghSahip').value='0xByteDeveloper';$('ghRepo').value='JamesWeb';
      $('ghDal').value='main';$('ghYol').value='icerik/site_icerik.json';}
    var t=localStorage.getItem(LS_TOKEN)||'';
    $('ghToken').value=t;
  }catch(e){}
  /* taslak var mı? */
  var tas=null;
  try{tas=localStorage.getItem(LS_TASLAK);}catch(e){}
  if(tas){
    try{
      var jt=JSON.parse(tas);
      if(jt&&jt.sema==='epinsitesi-icerik'){
        D=normalize(jt);
        secim={tur:'oyun',oyun:0,urun:0};
        agacAcik={0:true};   /* E183 */
        dokun();sahneCiz();agacCiz();
        $('durumCip').innerHTML='taslak geri yüklendi — '+$('durumCip').innerHTML;
      }
    }catch(e){}
  }
  sahneCiz();agacCiz();
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bagla);
else bagla();
</script>
<script>
/* E193: Toplu Sıkıştır / RKMP bölümü KALDIRILDI (E177_resim-avif-v6 canlı site
   paket tüketmez; kullanıcı isteğiyle şimdilik yok). Yalnız sunucuya sessiz
   token eşzamanlaması korunur — panel python sunucusuyla açıldığında çalışır. */
function backendVar(){ return location.protocol==='http:'||location.protocol==='https:'; }
/* panel açılışında: tarayıcıdaki token varsa sunucuya sessiz senkron */
(function(){
  if(!backendVar())return;
  try{
    var t=localStorage.getItem(LS_TOKEN)||'';
    if(!t)return;
    fetch('/api/durum').then(function(r){return r.json();}).then(function(j){
      if(!j.token)fetch('/api/token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:t})}).catch(function(){});
    }).catch(function(){});
  }catch(e){}
})();

</script>
