<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M2God Kontrol Paneli v9 — İçerik Otomasyonu (E198 · Python)</title>
<!--
  E198 · M2GOD KONTROL PANELİ v9 — İÇERİK OTOMASYONU (Python sunuculu)
  ═════════════════════════════════════════════
  (E195 taban — E177_resim-avif-v6 uyumlu; arama/boyutlandırma/temizle/çeviri/kur AYNEN)
  E198 YENİLİKLERİ (şifresiz PNG yükleme — "rmk'ya çevirmemek isteyebilir"):
  · HER resim alanının araç satırına 📤 PNG YÜKLE eklendi: resmi ŞİFRELEMEDEN
    olduğu gibi GitHub resimler/<ad>.<uzantı> olarak yükler, alan değerini
    OTOMATİK <ad>.<uzantı> yapar ve 🖼 Normal png moduna geçirir.
    (🖼 PNG→RMK AYNEN duruyor — şifreli isteyen onu kullanır.)
  · RESİMLER bölümüne de genel "📤 PNG Yükle (şifresiz)" kutusu eklendi.
  · SİTE MOTORU v5.3 (site paketi, surum E198): listede OLMAYAN .png/.jpg/
    .webp/.gif/.avif değerleri artık GitHub resimler/ klasöründen DOĞRUDAN
    yüklenir → şifresiz png panelden yüklendiği an SİTEDE DE GÖRÜNÜR
    (eski "localhost/…png arıyor" hatası imkânsız).
  · Akıllı koruma: bir adın .png karşılığı GitHub'a yüklüyse pngYukselt o
    değeri ARTIK _rkm.js'e çevirmez (kasıtlı png seçimi saygı görür); alan
    ipucunda "GitHub'da yüklü ✓" yazar.
  E197 YENİLİKLERİ ("m2god_logo.png NORMAL PNG mi?!" karmaşası TAMAMEN bitti):
  · PANEL HER AÇILIŞTA GITHUB'DAN OTOMATİK TAZE ÇEKER. Tarayıcı taslağı artık
    yalnız anlık iskelet/çevrimdışı yedek: açılışta güncel site_icerik.json
    gelip eski kopyanın üstüne yazar — "panelde eski veri kalıyor" durumu
    teknik olarak imkânsızlaşır.
  · OTOMATİK YÜKSELTME (pngYukselt): değeri .png/.jpg/… ile biten bir resim
    alanının şifreli karşılığı (<taban>_rkm.js) GitHub resimler/ klasöründe
    VARSA, değer açılışta/çekimde OTOMATİK <taban>_rkm.js'e çevrilir
    (GitHub'da png durmuyorken .png değeri kırık link üretir — newage/m2god
    dersi). Gerçek png niyetine dokunulmaz: yalnız şifreli karşılığı GitHub'da
    duran adlar düzeltilir, sayısı durum çipinde bildirilir.
  · 🖼 png modu ipucu güçlendi: adın şifreli karşılığı GitHub'da varsa alanın
    altında ⚠ uyarısı çıkar ("GitHub'da <taban>.png YÜKLÜ DEĞİL —
    <taban>_rkm.js duruyor; bu değer sitede resim ÇÖZDÜRMEZ — 🐙 moduna geç").
  E196 YENİLİKLERİ (resim adı karmaşası KÖKTEN bitti):
  · HER resim alanında 🐙/🖼 MOD SEÇİCİ: "🐙 Şifreli rkm.js" (GitHub — png indirilmez,
    KORUMALI) ↔ "🖼 Normal png" (korumasız, dosyayı sen hostlarsın). Seçim değişince
    alan değeri OTOMATİK yeniden yazılır: <taban>_rkm.js ↔ <taban>.png — artık
    ne yazacağını düşünmene gerek yok.
  · Alan değeri = GERÇEK dosya adı. Şifreli ise değer BİREBİR <ad>_rkm.js'dir
    (ör. newage_rkm.js); site o dosyayı GitHub'dan çeker. Eski mantıksal .png
    adları (m2god_logo.png gibi listede kayıtlılar) site motoru v5.2'de HÂLÂ
    çalışır — eski önbellekler bozulmaz.
  · Site motoru v5.2 (surum E196): listede OLMAYAN <ad>_rkm.js değerleri artık
    şifreli yüklenir → panelden eklenen YENİ resimler motor güncellemesi gerektirmez.
  · Tüm resim araçları (🔍 ⬆ 🖼 🗜) yükleme sonrası alan değerini otomatik
    <taban>_rkm.js yapar.
  E195 ÖZELLİKLERİ (aynen korunuyor):
  · RESİM ADI ANLAMI: alanların altında canlı ipucu + 4 araç düğmesi:
    🔍 Önizle · ⬆ RMK Yükle · 🖼 PNG→RMK (masaüstünden seç → şifrele) ·
    🗜 Sıkıştır (çöz → canvas WebP kilobayt küçültme → karşılaştır → yükle)
  · KUR MOTORU (sitenin EpinFX 6-API zinciri ile aynı): Parasal Eğri sütunlarında
    para birimi etiketi (USD/TL/EU) + 💱 Kura Çevir (canlı kur: open.er-api.com →
    currency-api.pages.dev → jsDelivr → Coinbase → floatrates; yedek gömülü kur)
    — paketler + darkside + liste fiyatı da birlikte çevrilebilir
  · YENİ ÜRÜN şablonu: klasik M2God düzeni otomatik dolar — fiyat $8 · 15/30 GÜNLÜK
    paketler · Parasal Eğri 2 sütun (3 → 0.8 · 30 → 8); isteyen + Sütun Ekle ile
    3.'yü 4.'yü ekler
  · panel_alan/ özel çalışma klasörü: sunucu çözülen resim karelerini buraya kaydeder
  E194 ÖZELLİKLERİ (aynen korunuyor):
  · OYUN formunda sürüm alanı YOK — "Ürün Sürümü" yalnız ÜRÜN formunda
    (oyun verisindeki surum/versiyonlar alanları veri olarak korunur; site
    detay panelindeki Version listesi oyunun kendi sürümlerini gösterir)
  · ÜRÜN formu akordeon kategorili: 📋 List Bilgisi (sitedeki liste kartında
    görünenler) · 🧩 Detay Panel Bilgisi · 💰 Fiyat & Paketler · 🏷️ Bayraklar ·
    🖥️ Client · 🎬 Trailer — başlığa tıkla: açılır/kapanır (büyür/küçülür)
  · 🖼️ RESİMLER bölümü: RMK → resim önizleme (GitHub'dan veya dosyadan) +
    resim → RKM dönüştürme (tarayıcıda canvas: PNG/WebP) + GitHub'a yükleme
    (resimler/<ad>_rkm.js) — sunucu uçları: /api/rkm/coz, /api/gh/resim-yukle
  · ↕ OYUN SIRALA görünümü: oyunları yukarı/aşağı taşı (1. sıra değişir:
    vitrin + liste + satın alma paneli sırası) · ağaçtaki ↑/↓ da aynen var
  · Ürün satırında ⧉ Kopyala düğmesi · yeni oyun/ürün akışı güçlendirildi
    (otomatik logo önerisi, güncelleme tarihi dolu gelir, yönlendirici notlar)
  Panel yalnız site_icerik.json ile çalışır; sitenin kendisine dokunmaz.
  Bilinmeyen anahtarlar (genişletilebilirlik) D objesinde aynen korunur.
-->
<style>
:root{
  --bg:#0b0e14;--panel:#121826;--panel2:#0d1320;--satir:#1a2233;
  --hat:#232c40;--yazi:#dbe2ef;--soluk:#8a93a6;--altin:#d9a441;
  --yesil:#3fb950;--kirmizi:#f85149;--amber:#d29922;--mavi:#58a6ff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--yazi);font:14px/1.5 'Segoe UI',system-ui,Arial,sans-serif;display:flex;flex-direction:column}
button{font:inherit;cursor:pointer;border:0;border-radius:6px;padding:7px 12px;background:var(--satir);color:var(--yazi)}
button:hover{filter:brightness(1.25)}
button.ana{background:var(--altin);color:#151006;font-weight:600}
button.tehlike{color:#ffb4ae;background:#3a1a1a}
button.kck{padding:3px 8px;font-size:12px;border-radius:5px}
input,select,textarea{font:inherit;background:var(--panel2);border:1px solid var(--hat);color:var(--yazi);border-radius:6px;padding:7px 9px;width:100%}
input:focus,select:focus,textarea:focus{outline:1px solid var(--altin)}
input[type=color]{padding:2px;height:36px;width:52px}
textarea{resize:vertical;min-height:60px}
label.aln{display:block;font-size:12px;color:var(--soluk);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.4px}
code{background:var(--panel2);border:1px solid var(--hat);border-radius:4px;padding:1px 5px;font-size:12px}

/* ── üst bar ── */
#ustbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--hat)}
#ustbar h1{font-size:16px;color:var(--altin);margin-right:6px}
#ustbar .bosluk{flex:1}
#durumCip{font-size:12px;color:var(--soluk);white-space:nowrap}
#durumCip b{color:var(--yesil)}

/* ── gövde ── */
#govde{flex:1;display:flex;min-height:0}
aside{width:300px;min-width:230px;background:var(--panel2);border-right:1px solid var(--hat);padding:10px;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;padding:16px 20px;min-width:0}
/* ── E183: ağaç arama + boyutlandırma ── */
#agacAramaKutu{display:flex;gap:4px;align-items:center;flex:0 0 auto;margin-bottom:8px}
#agacAramaKutu input{flex:1;min-width:0;font-size:13px}
#agac{flex:1;overflow-y:auto;min-height:0}
#agacSap{flex:0 0 7px;cursor:col-resize;background:transparent;touch-action:none;margin:0 -1px}
#agacSap:hover,#agacSap.surukle{background:var(--altin)}
.agVurgu{background:#3d2f10;color:var(--altin);border-radius:3px;padding:0 1px}
.agSatir .cevDurum{font-size:11px;color:var(--soluk)}

/* ── ağaç ── */
.agBaslik{display:flex;align-items:center;gap:6px;margin:14px 0 6px;font-size:12px;font-weight:700;letter-spacing:1px;color:var(--soluk);text-transform:uppercase}
.agBaslik:first-child{margin-top:2px}
.agBaslik .bosluk{flex:1}
.agSatir{display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:7px;cursor:pointer;border:1px solid transparent;margin-bottom:2px}
.agSatir:hover{background:var(--satir)}
.agSatir.secili{background:#221b0e;border-color:var(--altin)}
.agSatir .ad{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agSatir .muhur{font-size:11px;color:var(--soluk)}
.agSatir .arac{display:none;gap:2px}
.agSatir:hover .arac,.agSatir.secili .arac{display:flex}
.agUrunler{margin:2px 0 6px 22px;border-left:1px dashed var(--hat);padding-left:8px}
.bosNot{color:var(--soluk);font-size:12px;font-style:italic;padding:4px 9px}

/* ── form panelleri ── */
.fPanel{max-width:980px}
.fPanel h2{color:var(--altin);font-size:19px;margin-bottom:2px}
.fPanel .altYazi{color:var(--soluk);font-size:12px;margin-bottom:14px}
.izgara{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:0 14px}
.izgaraGenis{grid-template-columns:repeat(auto-fill,minmax(430px,1fr))}
.kutu{background:var(--panel);border:1px solid var(--hat);border-radius:10px;padding:14px 16px;margin-bottom:16px}
.kutu h3{font-size:13px;color:var(--altin);letter-spacing:.6px;text-transform:uppercase;margin-bottom:4px}
.kutu .ipucu{font-size:12px;color:var(--soluk);margin-bottom:8px}
.satirListe{display:flex;flex-direction:column;gap:6px}
.satirListe .oSatir{display:flex;gap:6px;align-items:center}
.satirListe .oSatir input[type=text],.satirListe .oSatir input[type=number]{flex:1}
.chkGrup{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}
.chkGrup label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--yazi);cursor:pointer}
.chkGrup input{width:auto}
.yatay{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.yatay>div{flex:1;min-width:120px}
.yatay input[type=color]{flex:0 0 52px;width:52px}
.yatay input[type=text]{flex:1;min-width:0}

/* ── sonuç listesi ── */
.sonuc{padding:8px 11px;border-radius:7px;margin-bottom:6px;font-size:13px;border:1px solid var(--hat)}
.sonuc.ok{background:#0f2315;border-color:#1f4d2a;color:#7ee2a0}
.sonuc.uyari{background:#2a230d;border-color:#5a4a17;color:#e7c56a}
.sonuc.hata{background:#2d1212;border-color:#5a2020;color:#ff9d95}

/* ── JSON çekmecesi ── */
#jsonCekmece{position:fixed;right:0;top:0;bottom:0;width:min(560px,60vw);background:var(--panel);border-left:1px solid var(--hat);z-index:50;display:none;flex-direction:column;box-shadow:-18px 0 40px rgba(0,0,0,.5)}
#jsonCekmece.acik{display:flex}
#jsonCekmece .baslik{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--hat)}
#jsonCekmece .baslik h3{flex:1;color:var(--altin);font-size:14px}
#jsonCekmece pre{flex:1;overflow:auto;padding:12px 14px;font:12px/1.45 Consolas,monospace;color:#c9d4e8;white-space:pre-wrap;word-break:break-word}

/* ── sekmeler (metinler grupları) ── */
.sekmeBar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.sekmeBar button.sec{background:#221b0e;color:var(--altin);border:1px solid var(--altin)}

/* ── E185: metinler katlanır dil ızgarası — satırda yalnız anahtar+kaynak+🔄+dol-sayacı; tüm diller açılır ızgarada ── */
.mSatir{margin:0 0 4px 0}
.mSatir .oSatir{margin-bottom:0}
.dilIzgara{display:none;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 14px;padding:7px 9px 9px 9px;margin-top:4px;border:1px dashed var(--hat);background:rgba(255,255,255,.025)}
.dilIzgara label{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--soluk);min-width:0}
.dilIzgara label span{min-width:22px;color:var(--altin);font-weight:600}
.dilIzgara label input{flex:1;min-width:0}

/* ── E194: akordeon kategoriler (ürün formu + resimler) ── */
.akKutu{background:var(--panel);border:1px solid var(--hat);border-radius:10px;margin-bottom:10px;overflow:hidden;transition:border-color .15s}
.akKutu.acik{border-color:#3a4a68}
.akBaslik{display:flex;align-items:center;gap:8px;padding:11px 14px;cursor:pointer;user-select:none;background:linear-gradient(180deg,rgba(217,164,65,.07),transparent)}
.akBaslik:hover{background:#1a2233}
.akBaslik .akOk{color:var(--altin);font-size:12px;width:14px;text-align:center;transition:transform .18s}
.akKutu.acik .akOk{transform:rotate(90deg)}
.akBaslik .akT{font-size:13px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--altin)}
.akBaslik .akSayi{font-size:11px;color:var(--soluk)}
.akBaslik .akIpucuK{flex:1;font-size:11.5px;color:var(--soluk);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-left:10px}
.akGovde{display:none;padding:4px 16px 14px 16px;border-top:1px solid var(--hat)}
.akKutu.acik .akGovde{display:block}
.akGovde .kutu{background:var(--panel2);margin-top:10px}

/* ── E194: resimler bölümü ── */
.rkmOnizleme{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.rkmOnizleme .rkmKare{background:repeating-conic-gradient(#1a2233 0% 25%,#121826 0% 50%) 50%/18px 18px;border:1px solid var(--hat);border-radius:8px;padding:8px;min-width:120px;min-height:80px;display:flex;align-items:center;justify-content:center}
.rkmOnizleme img{max-width:340px;max-height:220px;image-rendering:auto;display:block}
.rkmBilgi{font-size:12px;color:var(--soluk);line-height:1.7}
.rkmBilgi b{color:var(--yazi)}
.rkmAdim{border-left:3px solid var(--altin);background:var(--panel2);border-radius:0 8px 8px 0;padding:8px 12px;margin:10px 0;font-size:12.5px;color:var(--yazi)}
.rkmAdim b{color:var(--altin)}
.siraSatir{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--hat);border-radius:8px;margin-bottom:5px;background:var(--panel)}
.siraSatir .srNo{font-weight:700;color:var(--altin);min-width:26px;text-align:center}
.siraSatir .srAd{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.siraSatir .srMuhur{font-size:11px;color:var(--soluk)}
.ipucuBar{background:#221b0e;border:1px solid #5a4a17;color:#e7c56a;border-radius:8px;padding:8px 12px;font-size:12.5px;margin-bottom:12px}

/* ── E195: resim araç satırı + alan altı ipucu ── */
.resimAraclar{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px;align-items:center}
.resimAraclar button{padding:3px 8px;font-size:11.5px;border-radius:5px}
.resimIpucu{font-size:11.5px;color:var(--soluk);margin-top:5px;line-height:1.5}
.resimIpucu code{font-size:11px}
.resimCikti{margin-top:8px;border:1px dashed var(--hat);border-radius:8px;padding:8px;background:rgba(255,255,255,.02)}
.resimCikti .rkmKare{background:repeating-conic-gradient(#1a2233 0% 25%,#121826 0% 50%) 50%/18px 18px;border:1px solid var(--hat);border-radius:8px;padding:6px;min-width:80px;min-height:56px;display:flex;align-items:center;justify-content:center}
.resimCikti img{max-width:280px;max-height:170px;display:block}
.oSatir .resimAraclar{margin-top:0;display:inline-flex}
/* ── E196: resim mod seçici (🐙 şifreli rkm.js ↔ 🖼 normal png) ── */
.resimSatir{display:flex;gap:6px;align-items:center}
.resimSatir input{flex:1 1 auto}
select.resimMod{width:auto;flex:0 0 auto;min-width:132px;font-size:11.5px;padding:4px 6px}
.oSatir select.resimMod{min-width:104px;font-size:11px;padding:3px 4px}

/* ── E195: kur araçları (parasal eğri + paketler) ── */
.kurSatir{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:8px 0 4px 0;padding:8px 10px;background:var(--panel2);border:1px solid var(--hat);border-radius:8px}
.kurSatir .kurEt{font-size:12px;color:var(--yazi);white-space:nowrap}
.kurSatir select{width:auto;min-width:86px;flex:0 0 auto;padding:5px 7px}
.kurSatir button{padding:5px 10px;font-size:12px}
.kurBilgi{font-size:11.5px;color:var(--soluk);flex:1 1 100%;line-height:1.5}
.kurBilgi b{color:var(--yazi)}
.kurSimge{font-size:12px;color:var(--altin);font-weight:700;min-width:22px;text-align:center;background:var(--panel);border:1px solid var(--hat);border-radius:5px;padding:6px 4px}
</style>
</head>
<body>
<div id="ustbar">
  <h1>⚙ M2God Kontrol Paneli</h1>
  <span id="durumCip">içerik yüklenmedi</span>
  <span class="bosluk"></span>
  <button id="bCek" title="GitHub raw'dan site_icerik.json TAZE çeker (E183: önbellek kırıcı — her seferinde güncel)">⬇ GitHub'dan Çek</button>
  <button id="bTemizle" title="Tarayıcıdaki YEREL verileri siler: taslak (localStorage) + arama filtresi + ekrandaki içerik (bellek). Bekleyen otomatik taslak kaydı da iptal edilir (E184). GitHub'daki veriye DOKUNMAZ; ardından güncel içerik taze çekilir">🧹 Verileri Temizle</button>
  <button id="bDosya" title="Bilgisayardan site_icerik.json yükler">📂 Dosyadan Yükle</button>
  <input type="file" id="dosyaGiris" accept=".json,application/json" style="display:none">
  <button id="bYukle" class="ana" title="Değişiklikleri GitHub'a push eder (zaman otomatik tazelenir)">⬆ GitHub'a Yükle</button>
  <button id="bIndir" title="Üretilen JSON'u dosya olarak indirir">💾 JSON İndir</button>
  <button id="bJson" title="Üretilen JSON'u görüntüle (isteğe bağlı)">👁 JSON'u Gör</button>
  <button id="bDogrula" title="İçerik doğrulaması çalıştır">✓ Doğrula</button>
  <button id="bGitHub" title="GitHub ayarları">🐙 Ayarlar</button>
</div>

<div id="githubAlani" style="display:none;background:var(--panel);border-bottom:1px solid var(--hat);padding:12px 14px">
  <div class="izgara">
    <div><label class="aln">Sahip (owner)</label><input id="ghSahip" type="text"></div>
    <div><label class="aln">Depo (repo)</label><input id="ghRepo" type="text"></div>
    <div><label class="aln">Dal (branch)</label><input id="ghDal" type="text" value="main"></div>
    <div><label class="aln">İçerik yolu</label><input id="ghYol" type="text" value="icerik/site_icerik.json"></div>
    <div style="grid-column:span 2"><label class="aln">Token (fine-grained PAT — yalnız bu tarayıcıda, localStorage'da tutulur; hiçbir dosyaya yazılmaz)</label>
      <input id="ghToken" type="password" placeholder="github_pat_…"></div>
  </div>
  <div class="yatay" style="margin-top:10px">
    <button id="ghKaydet" class="kck ana">Ayarları Kaydet</button>

/* ── küçük yardımcılar ── */
function $(x){return document.getElementById(x);}
function nSay(v){var n=parseFloat(String(v==null?'':v).replace(',','.'));return isNaN(n)?0:n;}
function nInt(v){return Math.round(nSay(v));}
function sGuven(v){return (v==null?'':String(v));}
function esc(s){return sGuven(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

}
/* E194: ad → dosya adayı (Türkçe karakter eşlemeli slug) — logo önerisi için */
function slug(ad){
  var s=sGuven(ad).toLowerCase();
  var es={'ç':'c','ğ':'g','ı':'i','ö':'o','ş':'s','ü':'u','â':'a','î':'i','û':'u'};
  s=s.replace(/[çğıöşüâîû]/g,function(c){return es[c]||c;});
  s=s.replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
  return s||'resim';
}

}

/* ── doküman normalizasyonu: bilinen alanları garantiye al, yabancı anahtara dokunma ── */
function normalize(d){
  if(!d||typeof d!=='object')return null;
  d.sema=(d.sema||'epinsitesi-icerik');d.semaSurum=(d.semaSurum||'1.0');
  d.zaman=nInt(d.zaman)||Math.floor(Date.now()/1000);
  if(!d.site||typeof d.site!=='object')d.site={};
  d.site.ad=(d.site.ad||'M2God');
  if(!d.site.baslik||typeof d.site.baslik!=='object')d.site.baslik={};
  if(!d.site.logo||typeof d.site.logo!=='object')d.site.logo={};
  if(!d.metinler||typeof d.metinler!=='object')d.metinler={};
  if(!Array.isArray(d.oyunlar))d.oyunlar=[];
  d.oyunlar.forEach(function(o){
    if(!o||typeof o!=='object')return;
    if(!Array.isArray(o.urunler))o.urunler=[];
    if(!Array.isArray(o.rozetler))o.rozetler=[];
    if(!Array.isArray(o.versiyonlar))o.versiyonlar=[];
    if(!Array.isArray(o.ozellikler))o.ozellikler=[];
    o.urunler.forEach(function(u){
      if(!u||typeof u!=='object')return;
      if(!u.fiyat||typeof u.fiyat!=='object')u.fiyat={tutar:0,paraBirimi:'USD'};
      if(!Array.isArray(u.paketler))u.paketler=[];
      if(!Array.isArray(u.darksidePaketler))u.darksidePaketler=[];
      if(!Array.isArray(u.parasalEgri))u.parasalEgri=[];
      if(!u.client||typeof u.client!=='object')u.client={};
      if(!Array.isArray(u.client.fotolar))u.client.fotolar=[];
      if(!Array.isArray(u.client.ozellikler))u.client.ozellikler=[];
      if(!u.trailer||typeof u.trailer!=='object')u.trailer={};
    });
  });
  if(!d.videolar||typeof d.videolar!=='object')d.videolar={};
  if(!Array.isArray(d.videolar.sekmeler))d.videolar.sekmeler=[];
  if(!Array.isArray(d.videolar.videolar))d.videolar.videolar=[];
  if(!d.videolar.ikonlar||typeof d.videolar.ikonlar!=='object')d.videolar.ikonlar={};
  return d;
}

function agacCiz(){

      urunler.forEach(function(u,j){
        if(q&&!adEs&&esU.indexOf(j)<0)return;

        var su=agacSatir('📦',u.ad||'(adsız ürün)',et,secim.tur==='urun'&&secim.oyun===i&&secim.urun===j);

   ['🧩','EKSİKLER','eksikler','otomatik']]
  .forEach(function(x){
    var sat=agacSatir(x[0],x[1],x[3],secim.tur===x[2]);

    a.appendChild(sat);
  });
}
function agacSatir(ikon,ad,muhur,sec){
  var d=document.createElement('div');d.className='agSatir'+(sec?' secili':'');
  d.innerHTML='<span>'+esc(ikon)+'</span><span class="ad">'+adVurgula(ad)+'</span>'+
    '<span class="muhur">'+esc(muhur)+'</span><span class="arac"></span>';

/* E183: arama eşleşmesini vurgula (esc sonrası, güvenli) */
function adVurgula(ad){
  var s=esc(sGuven(ad));var q=agacArama.trim();
  if(!q)return s;
  var rq=esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  try{return s.replace(new RegExp('('+rq+')','i'),'<b class="agVurgu">$1</b>');}catch(e){return s;}
}
function aracBtn(etiket,fn,cls){
  var b=document.createElement('button');b.className='kck '+(cls||'');b.textContent=etiket;
  b.onclick=function(ev){ev.stopPropagation();fn();};
  return b;
}
function oyunEkle(){
  D.oyunlar.push({ad:'Yeni Oyun',vitrinAd:'',logo:'',ikon:'🎮',tur:'MMORPG',surum:'v1.0',guncelleme:bugun(),mimari:'x32/x64',baslatma:'Start',renk:'#d9a441',gelistirici:D.site&&D.site.ad?D.site.ad+' Team':'',puan:0,kullanici:0,songun:0,rozetler:[],versiyonlar:['v1.0'],aciklama:'',ozellikler:[],urunler:[]});

function urunKopyala(oi,ui){
  var o=D.oyunlar[oi];if(!o||!o.urunler||!o.urunler[ui])return;
  var kopya=null;
  try{kopya=JSON.parse(JSON.stringify(o.urunler[ui]));}catch(e){return;}
  kopya.ad=(kopya.ad||'Ürün')+' Kopya';
  o.urunler.splice(ui+1,0,kopya);
  secim={tur:'urun',oyun:oi,urun:ui+1};
  agacAcik[oi]=true;
  dokun();sahneCiz();agacCiz();
  sonucYaz($('sahne'),'Ürün kopyalandı: "'+kopya.ad+'" — istediğin gibi düzenleyebilirsin.','ok');

/* E196: değer → mod. '_rkm.js' ile bitiyorsa şifreli (GitHub), değilse normal png */
function resimModu(v){return /_rkm\.js\s*$/i.test(sGuven(v).trim())?'rkm':'png';}
/* ── E197: eski .png değeri otomatik _rkm.js'e yükseltme ──
   rkmBiliniyor(taban): şifreli <taban>_rkm.js GitHub resimler/ klasöründe var mı?
   (canlı RESIMLER_GH listesi + sabit RESIMLER listesi — ikisi de aynı havuz) */
function rkmBiliniyor(taban){
  taban=String(taban||'').trim().replace(/_rkm\.js$/i,'');
  if(!taban)return false;
  if(RESIMLER_GH.indexOf(taban)>=0)return true;
  for(var i=0;i<RESIMLER.length;i++){if(String(RESIMLER[i]).replace(/_rkm\.js$/i,'')===taban)return true;}
  return false;
}
/* pngBiliniyor(taban): <taban>.png/.jpg/… ŞİFRESİZ dosya GitHub resimler/'de var mı? (E198)
   Yüklüyse bu bir KASITLI png seçimidir — pngYukselt dokunmaz, ipucu "✓ yüklü" yazar. */
function pngBiliniyor(taban){
  taban=String(taban||'').trim().replace(/_rkm\.js$/i,'');
  if(!taban||!RESIMLER_GH_TUM.length)return false;
  var re=new RegExp('^'+taban.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\.(png|jpe?g|webp|gif|avif)$','i');
  for(var j=0;j<RESIMLER_GH_TUM.length;j++){if(re.test(RESIMLER_GH_TUM[j]))return true;}
  return false;
}
/* pngYukselt(d): oyun/ürün/trailer/client foto değerleri arasında .png/.jpg/…
   ile biten ve şifreli karşılığı GitHub'da duran adları <taban>_rkm.js yapar.
   Dönen değer: kaç alan düzeltildi (0 = dokunulmadı). */
function pngYukselt(d){
  if(!d||!Array.isArray(d.oyunlar))return 0;
  var n=0;
  function yukselt(obj,anahtar){
    if(!obj)return;
    var v=String(obj[anahtar]==null?'':obj[anahtar]).trim();
    var m=v.match(/\.(png|jpe?g|webp|gif|bmp|avif)$/i);
    if(!m)return;
    var taban=v.slice(0,v.length-m[0].length);
    if(!taban||!rkmBiliniyor(taban))return;
    if(pngBiliniyor(taban))return;   /* E198: şifresiz png GitHub'daysa kasıtlı seçim — dokunma */
    obj[anahtar]=taban+'_rkm.js';n++;
  }
  d.oyunlar.forEach(function(o){
    if(!o||typeof o!=='object')return;
    yukselt(o,'logo');
    (o.urunler||[]).forEach(function(u){
      if(!u||typeof u!=='object')return;
      yukselt(u,'logo');
      if(u.trailer&&typeof u.trailer==='object')yukselt(u.trailer,'foto');
      if(u.client&&Array.isArray(u.client.fotolar))u.client.fotolar.forEach(function(f,i){yukselt(u.client.fotolar,i);});
    });
  });
  return n;
}
/* E196: mod seçici — 🐙 GitHub şifreli (rkm.js) ↔ 🖼 normal png; seçim değişince
   alan değeri OTOMATİK yeniden yazılır (<taban>_rkm.js ↔ <taban>.png) */
function resimModSec(degerAl,yaz){
  var mod=document.createElement('select');mod.className='resimMod';
  mod.title='🐙 Şifreli rkm.js: site resmi GitHub\'dan çözer — png indirilmez, korumalı (önerilen)\n🖼 Normal png: şifresiz dosya GitHub resimler/ klasöründen düz gösterilir — korumasız (📤 PNG Yükle ile yükle)';
  [['rkm','🐙 Şifreli rkm.js'],['png','🖼 Normal png']].forEach(function(x){
    var o=document.createElement('option');o.value=x[0];o.textContent=x[1];mod.appendChild(o);});
  mod.value=resimModu(degerAl());
  mod.__senkron=function(){mod.value=resimModu(degerAl());};   /* E198: araç/alan değeri yazılınca mod etiketi de tazelenir */
  mod.onchange=function(){
    var t=rkmTaban(degerAl());
    if(!t){mod.value=resimModu(degerAl());return;}   /* boş değer: yalnız görünüm */
    var yeni=(mod.value==='rkm')?(t+'_rkm.js'):(t+'.png');
    yaz(yeni);mod.value=resimModu(yeni);
  };
  return mod;
}

  return i;

}

/* ══════════ E195: KUR MOTORU — sitenin EpinFX zinciri ile BİREBİR kaynak sırası ══════════
   Sitedeki gibi USD bazlı kur; sunucudaki /api/kur aynı 6-API zincirini sırar
   (open.er-api.com → currency-api.pages.dev → jsDelivr → Coinbase → floatrates),
   hepsi düşerse gömülü yedek kur kullanılır (site FALLBACK ile aynı değerler). */
var KUR_ONBELLEK=null,KUR_ZAMAN=0;
var KUR_SIMGE={USD:'$',TL:'₺',EU:'€'};
var KUR_KOD={USD:'USD',TL:'TRY',EU:'EUR'};   /* panel paketKur kodu → ISO kod */
var KUR_LISTE=['USD','TL','EU'];
function kurEtiket(k){var s=KUR_SIMGE[k]||k;return k+' ('+s+')';}
function kurGetir(cb){
  var simdi=Date.now();
  if(KUR_ONBELLEK&&simdi-KUR_ZAMAN<600000){cb(KUR_ONBELLEK);return;}
  if(!backendVar()){   /* dosyadan açıldı (file://) — gömülü yedek */
    KUR_ONBELLEK={canli:false,kaynak:'gömülü yedek',rates:{USD:1,TRY:48.468802,EUR:0.860279}};
    KUR_ZAMAN=simdi;cb(KUR_ONBELLEK);return;
  }
  fetch('/api/kur',{cache:'no-store'}).then(function(r){return r.json();}).then(function(j){
    if(!j||!j.ok||!j.rates)throw new Error((j&&j.hata)||'kur alınamadı');
    KUR_ONBELLEK=j;KUR_ZAMAN=simdi;cb(j);
  }).catch(function(){
    KUR_ONBELLEK={canli:false,kaynak:'gömülü yedek',rates:{USD:1,TRY:48.468802,EUR:0.860279}};
    KUR_ZAMAN=simdi;cb(KUR_ONBELLEK);
  });
}
function kurCevir(tutar,kaynakKod,hedefKod,rates){
  var k=kaynakKod==='USD'?1:(nSay(rates[kaynakKod])||0);
  var h=hedefKod==='USD'?1:(nSay(rates[hedefKod])||0);
  if(!k||!h)return 0;
  return tutar/k*h;
}
function kurYuvarla(v){
  if(!isFinite(v))return 0;
  if(Math.abs(v)>=100)return Math.round(v);
  if(Math.abs(v)>=10)return Math.round(v*10)/10;
  return Math.round(v*100)/100;
}
/* E195: kur satırı — "💱 Çevir: [hedef] [Çevir]" + bilgi satırı.
   kaynakGet/set: ürünün paketKur'u (USD/TL/EU). fiyatNesneleri: [{nesne,alan}] —
   paketKur para birimindeki sayı alanları. ekstra(fn) — dönüşüm sonrası ek iş
   (ör. fiyat.tutar+paraBirimi). kapsa: satırın ekleneceği yer. */
function kurAraci(kapsa,kaynakGet,kaynakSet,fiyatNesneleri,ekstra){
  var satir=document.createElement('div');satir.className='kurSatir';
  var et=document.createElement('span');et.className='kurEt';
  et.textContent='💱 Kura Çevir:';satir.appendChild(et);
  var hedefSel=document.createElement('select');
  KUR_LISTE.forEach(function(k){var o=document.createElement('option');o.value=k;o.textContent=kurEtiket(k);hedefSel.appendChild(o);});
  satir.appendChild(hedefSel);
  var btn=document.createElement('button');btn.className='kck';btn.textContent='Çevir';
  satir.appendChild(btn);
  var bilgi=document.createElement('div');bilgi.className='kurBilgi';
  bilgi.innerHTML='Sütun para birimiyle yazdığın değerleri başka kura çevirir — site <b>open.er-api.com → currency-api.pages.dev → jsDelivr → Coinbase → floatrates</b> zincirini kullanır (12 saat önbellek).';
  satir.appendChild(bilgi);
  btn.onclick=function(){
    var kaynak=kaynakGet()||'USD',hedef=hedefSel.value;
    if(kaynak===hedef){bilgi.innerHTML='<span style="color:#e7c56a">Kaynak ile hedef aynı ('+esc(kaynak)+') — başka bir hedef seç.</span>';return;}
    btn.disabled=true;btn.textContent='kur çekiliyor…';
    kurGetir(function(K){
      btn.disabled=false;btn.textContent='Çevir';
      var oran=kurCevir(1,KUR_KOD[kaynak],KUR_KOD[hedef],K.rates);
      if(!oran){bilgi.innerHTML='<span style="color:#ff9d95">Kur okunamadı ('+esc(kaynak)+' → '+esc(hedef)+').</span>';return;}
      var n=(fiyatNesneleri||[]).length;
      var onay='Kur: 1 '+kaynak+' = '+oran+' '+hedef+'   ('+K.kaynak+(K.canli?', canlı':', GÖMÜLÜ YEDEK')+')\n\n'+
        n+' değer '+kaynak+' → '+hedef+' çevrilecek'+(ekstra?' (liste fiyatı dahil)':'')+'.\nDevam edilsin mi?';
      if(!confirm(onay))return;
      (fiyatNesneleri||[]).forEach(function(x){x.nesne[x.alan]=kurYuvarla(kurCevir(nSay(x.nesne[x.alan]),KUR_KOD[kaynak],KUR_KOD[hedef],K.rates));});
      kaynakSet(hedef);
      if(ekstra)ekstra(hedef,K);
      bilgi.innerHTML='Çevrildi: <b>'+esc(kaynak)+' → '+esc(hedef)+'</b> · kur: <b>'+oran+'</b> · kaynak: <b>'+esc(K.kaynak)+(K.canli?' (canlı)':' (gömülü yedek)')+'</b>';
      dokun();sahneCiz();
    });
  };
  kapsa.appendChild(satir);
  return satir;
}

/* ══════════ E195: RESİM ARAÇ KÜMESİ — her resim adı alanının yanına 4 düğme ══════════
   🔍 Önizle   : GitHub'daki resimler/<taban>_rkm.js'i sunucuda çözüp gösterir
   ⬆ RMK Yükle : hazır *_rkm.js dosyasını seç → hedef adla GitHub'a push
   🖼 PNG→RMK  : masaüstünden PNG/WebP/JPG seç → canvas'ta küçült/WebP'le → şifrele → push
   🗜 Sıkıştır : GitHub'daki resmi çöz → canvas WebP kalite ayarlı küçültme → karşılaştır → push
   adAlFn(): alanın anlık değeri (m2god_logo.png | m2god_logo | SiteLogo …)
   cikti: sonuçların yazılacağı div · adYazFn(yeni): (isteğe bağlı) alan değerini yazar */
function resimAraclari(kapsa,adAlFn,cikti,adYazFn){
  var satir=document.createElement('div');satir.className='resimAraclar';
  function taban(){var v=sGuven(adAlFn()).trim();return v?rkmTaban(v):'';}
  function goster(html){cikti.innerHTML=html;}
  function kapat(){cikti.innerHTML='';}
  function hata(m){goster('<div class="sonuc hata">'+esc(m)+'</div>');}
  function bekliyor(m){goster('<div class="bosNot">'+esc(m||'çalışıyor…')+'</div>');}

  /* ortak: RKM objesini baytlara çöz (tarayıcı) */
  function rkmBayt(obj){
    var ham=atob(obj.d.replace(/\s+/g,''));
    var bayt=new Uint8Array(ham.length);
    for(var i=0;i<ham.length;i++)bayt[i]=ham.charCodeAt(i)^obj.k[i%obj.k.length];
    return bayt;
  }
  /* ortak: RKM JS metnini GitHub'a yükle */
  function yukleJs(tabanAd,metin,okCb){
    if(!backendVar()){hata('sunucu yok — kontrol_paneli.py ile başlat');return;}
    if(RESIMLER_GH.indexOf(tabanAd)>=0&&!confirm('resimler/'+tabanAd+'_rkm.js GitHub\'da ZATEN VAR.\nÜzerine yazılsın mı?'))return;
    bekliyor('GitHub\'a yükleniyor… resimler/'+tabanAd+'_rkm.js');
    fetch('/api/gh/resim-yukle',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ad:tabanAd,icerik:metin})})
    .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
    .then(function(x){
      if(!x.ok||!x.j.ok)throw new Error((x.j&&x.j.hata)||('HTTP hata'));
      if(RESIMLER_GH.indexOf(tabanAd)<0){RESIMLER_GH.push(tabanAd);}
      goster('<div class="sonuc ok">Yüklendi: <b>resimler/'+esc(tabanAd)+'_rkm.js</b> (commit '+(x.j.commit||'?')+') — raw CDN ~5 dk içinde tazelenir.</div>');
      try{agacCiz();}catch(e){}
      if(okCb)okCb();
    })
    .catch(function(e){hata('yükleme hatası: '+e.message+' (token: Ayarlar bölümünde kayıtlı olmalı — Contents: write)');});
  }
  /* ortak: sunucudan çöz (kare base64 + boyutlar) */
  function rkmCoz(tabanAd,cb){
    if(!backendVar()){hata('sunucu yok — kontrol_paneli.py ile başlat');return;}
    bekliyor('GitHub\'dan çözülüyor… '+tabanAd+'_rkm.js');
    fetch('/api/rkm/coz',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ad:tabanAd})})
    .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
    .then(function(x){
      if(!x.ok||!x.j.ok)throw new Error((x.j&&x.j.hata)||('HTTP hata'));
      cb(x.j);
    })
    .catch(function(e){hata('RMK çözülemedi: '+e.message);});
  }
  /* ortak: çözülmüş kare (base64) → önizleme + bilgi */
  function kareGoster(j,notEk){
    var ham=atob(j.veri);
    var bayt=new Uint8Array(ham.length);
    for(var i=0;i<ham.length;i++)bayt[i]=ham.charCodeAt(i);
    var blob=new Blob([bayt],{type:j.mime});
    goster('<div class="rkmKare"><img src="'+URL.createObjectURL(blob)+'" alt=""></div>'+
      '<div class="rkmBilgi"><b>'+esc(j.ad)+'</b><br>boyut: <b>'+j.w+'×'+j.h+'</b> · biçim: <b>'+j.mime+
      '</b> · kare: <b>'+kb(j.boyut)+'</b> · js dosyası: <b>'+kb(j.dosyaBoyut)+'</b><br>'+
      '<span style="color:var(--soluk)">'+esc(notEk||'')+'</span></div>');
  }
  /* ortak: Image → canvas → kodlanmış kare (WebP/PNG) → RKM JS metni */
  function imgdenRkm(im,tabanAd,f,q,genisSinir,cb){
    var w=im.naturalWidth,h=im.naturalHeight;
    if(!w||!h){cb(new Error('resim boyutu okunamadı'));return;}
    var cw=genisSinir>0&&w>genisSinir?genisSinir:w;
    var ch=genisSinir>0&&w>genisSinir?Math.round(h*cw/w):h;
    var cv=document.createElement('canvas');cv.width=cw;cv.height=ch;
    cv.getContext('2d').drawImage(im,0,0,cw,ch);
    cv.toBlob(function(blob){
      if(!blob){cb(new Error('canvas kodlaması başarısız (WebP desteklenmiyorsa PNG seç)'));return;}
      var oku=new FileReader();
      oku.onload=function(){
        try{
          var bayt=new Uint8Array(oku.result);
          var kaliteEt=(f==='p'?'png':'webp-q'+Math.round(q*100))+(cw!==w?' · '+cw+'x'+ch:'');
          cb(null,{metin:rkmJsUret(tabanAd,cw,ch,f,bayt,kaliteEt),bayt:bayt,cw:cw,ch:ch,mime:(f==='p'?'image/png':'image/webp')});
        }catch(e){cb(e);}
      };
      oku.readAsArrayBuffer(blob);
    },f==='p'?'image/png':'image/webp',q);
  }

  /* ── 1) 🔍 Önizle ── */
  var bOn=document.createElement('button');bOn.textContent='🔍 Önizle';bOn.title='GitHub\'daki şifreli resmi çözüp burada gösterir';
  bOn.onclick=function(){
    var t=taban();
    if(!t){hata('resim adı boş — önce alana bir ad yaz (ör. m2god_logo_rkm.js)');return;}
    rkmCoz(t,function(j){kareGoster(j,'GitHub raw\'dan çözüldü — site motoruyla aynı yol · kopya: panel_alan/'+j.ad+'_'+j.w+'x'+j.h);});
  };
  satir.appendChild(bOn);

  /* ── 2) ⬆ RMK Yükle ── */
  var fRMK=document.createElement('input');fRMK.type='file';fRMK.accept='.js,text/javascript';fRMK.style.display='none';
  satir.appendChild(fRMK);
  var bYuk=document.createElement('button');bYuk.textContent='⬆ RMK Yükle';bYuk.title='Hazır şifreli *_rkm.js dosyasını bu adla GitHub\'a yükle';
  bYuk.onclick=function(){
    var t=taban();
    if(!t){hata('resim adı boş — önce alana bir ad yaz');return;}
    fRMK.click();
  };
  fRMK.onchange=function(){
    if(!this.files||!this.files[0]){this.value='';return;}
    var f=this.files[0];this.value='';
    var t=taban();
    var oku=new FileReader();
    oku.onload=function(){
      try{
        var pak=rkmObjCikar(String(oku.result));
        var metin=String(oku.result);
        if(pak.ad!==t){   /* iç anahtar hedef adla değiştirilir — site böyle bulur */
          var bayt=rkmBayt(pak.obj);
          var kaliteEt='rkm-yeniden-adlandirildi';
          metin=rkmJsUret(t,pak.obj.w,pak.obj.h,pak.obj.f,bayt,kaliteEt);
        }
        yukleJs(t,metin,function(){if(adYazFn)adYazFn(t+'_rkm.js');});   /* E196: alan değerini şifreli ada yaz */
      }catch(e){hata(e.message);}
    };
    oku.readAsText(f);
  };
  satir.appendChild(bYuk);

  /* ── 3) 🖼 PNG→RMK ── */
  var fPNG=document.createElement('input');fPNG.type='file';fPNG.accept='image/png,image/webp,image/jpeg,image/avif,image/*';fPNG.style.display='none';
  satir.appendChild(fPNG);
  var bDon=document.createElement('button');bDon.textContent='🖼 PNG→RMK';bDon.title='Masaüstünden resim seç → küçült/WebP → RKM şifrele → GitHub\'a yükle';
  bDon.onclick=function(){
    var t=taban();
    if(!t){hata('resim adı boş — önce alana bir ad yaz (ör. newage_rkm.js)');return;}
    fPNG.click();
  };
  fPNG.onchange=function(){
    if(!this.files||!this.files[0]){this.value='';return;}
    var f=this.files[0];this.value='';
    var t=taban();
    var url=URL.createObjectURL(f);
    var im=new Image();
    im.onload=function(){
      goster('<div class="rkmKare"><img src="'+url+'" alt=""></div>'+
        '<div class="rkmBilgi"><b>'+esc(f.name)+'</b> · '+kb(f.size)+' · '+im.naturalWidth+'×'+im.naturalHeight+
        '<br><span style="color:var(--soluk)">hedef: resimler/'+esc(t)+'_rkm.js</span></div>');
      var ayar=document.createElement('div');ayar.className='yatay';ayar.style.marginTop='8px';
      var w1=document.createElement('div');aln(w1,'Biçim');
      var selF=document.createElement('select');
      [['w','WebP (önerilen — küçük)'],['p','PNG (kayıpsız)']].forEach(function(x){var o=document.createElement('option');o.value=x[0];o.textContent=x[1];selF.appendChild(o);});
      w1.appendChild(selF);ayar.appendChild(w1);
      var w2=document.createElement('div');aln(w2,'WebP kalite (50-100)');
      var inQ=document.createElement('input');inQ.type='number';inQ.min='50';inQ.max='100';inQ.value='92';w2.appendChild(inQ);ayar.appendChild(w2);
      var w3=document.createElement('div');aln(w3,'Genişlik sınırı (px — 0: aynen)');
      var inW=document.createElement('input');inW.type='number';inW.min='0';inW.value='0';w3.appendChild(inW);ayar.appendChild(w3);
      cikti.appendChild(ayar);
      var bCev=document.createElement('button');bCev.className='ana';bCev.textContent='🔄 Dönüştür ve Önizle';bCev.style.marginTop='8px';
      cikti.appendChild(bCev);
      var sonuc=null;
      bCev.onclick=function(){
        bCev.disabled=true;
        imgdenRkm(im,t,selF.value,Math.min(1,Math.max(.5,nSay(inQ.value)/100)),nInt(inW.value),function(e,r){
          bCev.disabled=false;
          if(e){hata(e.message);return;}
          sonuc=r;
          goster('<div class="rkmKare"><img src="'+URL.createObjectURL(new Blob([r.bayt],{type:r.mime}))+'" alt=""></div>'+
            '<div class="rkmBilgi"><b>'+esc(t)+'_rkm.js</b> hazır<br>çerçeve: <b>'+r.cw+'×'+r.ch+'</b> · biçim: <b>'+r.mime+
            '</b><br>orijinal: <b>'+kb(f.size)+'</b> → rkm kare: <b>'+kb(r.bayt.length)+'</b> · js dosyası: <b>'+kb(r.metin.length)+'</b></div>');
          var bUp=document.createElement('button');bUp.className='ana';bUp.textContent='⬆ GitHub\'a Yükle';bUp.style.marginTop='8px';
          bUp.onclick=function(){
            bUp.disabled=true;
            yukleJs(t,r.metin,function(){
              if(adYazFn)adYazFn(t+'_rkm.js');   /* E196: şifreli dosya yüklendi → değer de şifreli ad olsun */
            });
          };
          cikti.appendChild(bUp);
        });
      };
    };
    im.onerror=function(){hata('resim açılamadı — biçim desteklenmiyor olabilir');};
    im.src=url;
  };
  satir.appendChild(bDon);

  /* ── 4b) 📤 PNG Yükle (şifresiz ham dosya) — E198 ──
     "kişi rmk'ya çevirmemek isteyebilir": resim olduğu gibi GitHub resimler/
     klasörüne yüklenir, alan değeri <taban>.<uzantı> yapılır (🖼 png modu).
     Site motoru v5.3 bu dosyayı GitHub'dan DOĞRUDAN gösterir. */
  var fHam=document.createElement('input');fHam.type='file';fHam.accept='image/png,image/jpeg,image/webp,image/gif,image/avif,image/*';fHam.style.display='none';
  satir.appendChild(fHam);
  var bHam=document.createElement('button');bHam.textContent='📤 PNG Yükle';bHam.title='Resmi ŞİFRELEMEDEN olduğu gibi GitHub resimler/ klasörüne yükle — alan değeri <ad>.<uzantı> yapılır, 🖼 Normal png moduna geçer (korumasız). Şifreli istiyorsan PNG→RMK kullan.';
  bHam.onclick=function(){
    var t=taban();
    if(!t){hata('resim adı boş — önce alana bir ad yaz (ör. newage_rkm.js)');return;}
    fHam.click();
  };
  fHam.onchange=function(){
    if(!this.files||!this.files[0]){this.value='';return;}
    var f=this.files[0];this.value='';
    var t=taban();
    var uz=null,m=f.name.match(/\.(png|jpe?g|webp|gif|avif)$/i);
    if(m){uz=m[1].toLowerCase();if(uz==='jpeg')uz='jpg';}
    else{
      var mm=(f.type||'').match(/^image\/(png|jpeg|webp|gif|avif)$/i);
      if(mm){uz=mm[1].toLowerCase();if(uz==='jpeg')uz='jpg';}
    }
    if(!uz){hata('desteklenmeyen biçim — png/jpg/webp/gif/avif yükle (şifrelemek için PNG→RMK)');return;}
    var hedef=t+'.'+uz;
    if(!backendVar()){hata('sunucu yok — kontrol_paneli.py ile başlat');return;}
    if(RESIMLER_GH_TUM.indexOf(hedef)>=0&&!confirm('resimler/'+hedef+' GitHub\'da ZATEN VAR.\nÜzerine yazılsın mı?'))return;
    var oku=new FileReader();
    oku.onload=function(){
      var b64=(String(oku.result).split(',')[1])||'';
      if(!b64){hata('dosya okunamadı');return;}
      bekliyor('GitHub\'a yükleniyor (şifresiz)… resimler/'+hedef+' ('+kb(f.size)+')');
      fetch('/api/gh/dosya-yukle',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ad:hedef,icerik:b64})})
      .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
      .then(function(x){
        if(!x.ok||!x.j.ok)throw new Error((x.j&&x.j.hata)||('HTTP hata'));
        if(RESIMLER_GH_TUM.indexOf(hedef)<0)RESIMLER_GH_TUM.push(hedef);
        goster('<div class="sonuc ok">Yüklendi (ŞİFRESİZ): <b>resimler/'+esc(hedef)+'</b> ('+kb(f.size)+', commit '+(x.j.commit||'?')+')<br>alan değeri <b>'+esc(hedef)+'</b> yapıldı → 🖼 Normal png modu · site motoru v5.3 bunu GitHub\'dan düz gösterir (raw CDN ~5 dk).</div>');
        if(adYazFn)adYazFn(hedef);   /* E198: değer = gerçek dosya adı; mod 🖼'e döner */
        try{agacCiz();}catch(e){}
      })
      .catch(function(e){hata('şifresiz yükleme hatası: '+e.message+' (token: Ayarlar bölümünde kayıtlı olmalı — Contents: write)');});
    };
    oku.readAsDataURL(f);
  };
  satir.appendChild(bHam);

  /* ── 4) 🗜 Sıkıştır ── */
  var bSik=document.createElement('button');bSik.textContent='🗜 Sıkıştır';bSik.title='GitHub\'daki resmi çöz → WebP kalite ayarıyla kilobayt küçült → karşılaştır → yükle';
  bSik.onclick=function(){
    var t=taban();
    if(!t){hata('resim adı boş — önce alana bir ad yaz');return;}
    rkmCoz(t,function(j){
      var ham=atob(j.veri);
      var bayt=new Uint8Array(ham.length);
      for(var i=0;i<ham.length;i++)bayt[i]=ham.charCodeAt(i);
      var onceKb=j.boyut,dosyaOnceKb=j.dosyaBoyut;
      var url=URL.createObjectURL(new Blob([bayt],{type:j.mime}));
      var im=new Image();
      im.onload=function(){
        goster('<div class="rkmKare"><img src="'+url+'" alt=""></div>'+
          '<div class="rkmBilgi"><b>'+esc(j.ad)+'</b> · '+j.w+'×'+j.h+' · biçim: '+j.mime+' · kare: <b>'+kb(onceKb)+'</b> · js dosyası: <b>'+kb(dosyaOnceKb)+'</b>'+
          '<br><span style="color:var(--soluk)">canvas WebP ile yeniden kodlanacak — kaliteyi düşürdükçe kilobayt düşer</span></div>');

/* ══════════ E194: RESİMLER (RKM) — RMK ↔ resim ══════════
   RKM v4 biçimi (sitenin motoruyla birebir):
     RKM_VERI['<ad>']={w,h,f,k,d}
     f: 'w'=image/webp · 'a'=image/avif · 'p'=image/png
     k: 64 baytlık rastgele XOR anahtarı (dizi)
     d: base64( kare_baytları XOR k[i%64] )
   Dönüştürme TARAYICIDA yapılır (canvas): PNG kayıpsız ya da WebP kalite ayarlı.
   Yükleme sunucu üzerinden: /api/gh/resim-yukle → resimler/<ad>_rkm.js push. */
function rkmMime(f){return f==='a'?'image/avif':(f==='p'?'image/png':'image/webp');}
/* JS metninden RKM objesini çıkar */
function rkmObjCikar(metin){
  var m=/RKM_VERI\[['"]([^'"]+)['"]\]\s*=\s*(\{[\s\S]*?\});\s*$/.exec(metin||'') ||
        /RKM_VERI\[['"]([^'"]+)['"]\]\s*=\s*(\{[\s\S]*?\});/.exec(metin||'');
  if(!m)throw new Error('RKM_VERI bulunamadı — bu dosya *_rkm.js değil');
  var obj=JSON.parse(m[2]);
  if(!obj||!obj.d||!obj.k)throw new Error('RKM objesi w/h/f/k/d alanlarını içermiyor');
  return {ad:m[1],obj:obj};
}
/* RKM objesi → veri URL'si (tarayıcıda çöz) */
function rkmObjVeriUrl(obj){
  var ham=atob(obj.d.replace(/\s+/g,''));
  var bayt=new Uint8Array(ham.length);
  for(var i=0;i<ham.length;i++)bayt[i]=ham.charCodeAt(i)^obj.k[i%obj.k.length];
  var blob=new Blob([bayt],{type:rkmMime(obj.f)});
  return URL.createObjectURL(blob);
}
/* kare baytları (Uint8Array) → RKM JS metni (v4 protokolü, site motoruyla birebir) */
function rkmJsUret(ad,w,h,f,bayt,kaliteEt){
  var k=new Uint8Array(64);
  if(window.crypto&&crypto.getRandomValues)crypto.getRandomValues(k);
  else for(var i=0;i<64;i++)k[i]=Math.floor(Math.random()*256);
  var xor=new Uint8Array(bayt.length);
  for(var j=0;j<bayt.length;j++)xor[j]=bayt[j]^k[j%64];
  /* base64 (parça parça — büyük karede stack taşıyor) */
  var bin='';var parca=32768;
  for(var a=0;a<xor.length;a+=parca)bin+=String.fromCharCode.apply(null,xor.subarray(a,a+parca));
  var d=btoa(bin);
  var obj={w:w,h:h,f:f,k:Array.prototype.slice.call(k),d:d};
  var metin='/* RKM VERI v4 · '+ad+' · '+w+'x'+h+' · '+kaliteEt+' · XOR64 + base64 · otomatik uretim, elle degistirme! */\n'+
    'window.RKM_VERI=window.RKM_VERI||{};\n'+
    "RKM_VERI['"+ad+"']="+JSON.stringify(obj)+";\n";
  return metin;
}
function kb(n){return (n/1024).toFixed(1)+' KB';}
/* resim adı (metin2_logo | metin2_logo.png | metin2_logo_rkm.js) → rkm taban adı */
function rkmTaban(ad){
  var s=sGuven(ad).trim();
  s=s.replace(/_rkm\.js$/i,'').replace(/\.(png|webp|avif|jpe?g|gif)$/i,'');
  return s;
}

  bYukle.onclick=function(){

    bYukle.disabled=true;
    cikB.insertAdjacentHTML('beforeend','<div class="bosNot">GitHub\'a yükleniyor… resimler/'+sonucB.ad+'_rkm.js</div>');
    fetch('/api/gh/resim-yukle',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ad:sonucB.ad,icerik:sonucB.metin})})
    .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
    .then(function(x){
      if(!x.ok||!x.j.ok)throw new Error(x.j&&x.j.hata||('HTTP hata'));
      cikB.insertAdjacentHTML('beforeend','<div class="sonuc ok">Yüklendi: resimler/'+esc(sonucB.ad)+
        '_rkm.js (commit '+(x.j.commit||'?')+') — raw CDN ~5 dk içinde güncellenir.</div>');
      if(RESIMLER_GH.indexOf(sonucB.ad)<0){RESIMLER_GH.push(sonucB.ad);agacCiz();}
    })
    .catch(function(e){
      cikB.insertAdjacentHTML('beforeend','<div class="sonuc hata">Yükleme hatası: '+esc(e.message)+' (token: Ayarlar bölümünde kayıtlı olmalı — Contents: write)</div>');
      bYukle.disabled=false;
    });
  };

  /* ── C) 📤 PNG Yükle (şifresiz ham dosya) — E198 ──
     Resmi ŞİFRELEMEDEN resimler/ klasörüne yükler; site motoru v5.3 bu
     dosyayı GitHub'dan DOĞRUDAN gösterir. Bir resim alanında kullanmak
     için alan değerini <ad>.<uzantı> yazıp 🖼 png modunda bırakman yeterli. */
  var gC=akordeonKutu(p,'rkm_ham','📤 PNG Yükle (şifresiz — ham dosya)','şifrelemeden yükle',
    'GitHub resimler/ klasörüne olduğu gider',false);
  var satC=document.createElement('div');satC.className='yatay';gC.appendChild(satC);

  gC.appendChild(dC);
  var inC=document.createElement('input');inC.type='text';inC.setAttribute('list','dl_ham_gh');
  inC.placeholder='hedef ad (ör. yeni_resim.png)';inC.style.maxWidth='300px';
  satC.appendChild(inC);
  var fC=document.createElement('input');fC.type='file';fC.accept='image/png,image/jpeg,image/webp,image/gif,image/avif,image/*';fC.style.display='none';
  satC.appendChild(fC);
  var bC=document.createElement('button');bC.className='ana';bC.textContent='📤 Resim Seç ve Şifresiz Yükle';
  bC.title='Dosya adındaki uzantı kullanılır (ör. resim.jpg → <ad>.jpg). Hedef adın uzantısı dosyayla aynı olmalı.';
  satC.appendChild(bC);

  cikC.innerHTML='<div class="bosNot">(henüz yükleme yok — hedef ad yaz, resim seç, yükle. Korumasız olur: png herkese açık gider. Şifreli için B bölümünü kullan.)</div>';
  gC.appendChild(cikC);
  bC.onclick=function(){
    var ad=(inC.value||'').trim();
    if(!/^[A-Za-z0-9_\-]+\.(png|jpe?g|webp|gif|avif)$/i.test(ad)){cikC.innerHTML='<div class="sonuc hata">hedef ad geçersiz — <ad>.png/.jpg/.webp/.gif/.avif yaz (ör. yeni_resim.png)</div>';return;}
    ad=ad.replace(/\.jpeg$/i,'.jpg');
    fC.click();
  };
  fC.onchange=function(){
    if(!this.files||!this.files[0]){this.value='';return;}
    var f=this.files[0];this.value='';
    var ad=(inC.value||'').trim().replace(/\.jpeg$/i,'.jpg');
    if(!/^[A-Za-z0-9_\-]+\.(png|jpg|webp|gif|avif)$/i.test(ad)){cikC.innerHTML='<div class="sonuc hata">hedef ad geçersiz</div>';return;}
    var m=f.name.match(/\.(png|jpe?g|webp|gif|avif)$/i);
    if(!m){cikC.innerHTML='<div class="sonuc hata">dosya uzantısı png/jpg/webp/gif/avif olmalı</div>';return;}
    var fuz=m[1].toLowerCase();if(fuz==='jpeg')fuz='jpg';
    var huz=ad.split('.').pop().toLowerCase();
    if(fuz!==huz){cikC.innerHTML='<div class="sonuc hata">uzantı uyuşmuyor — dosya .'+fuz+' ama hedef .'+huz+' (hedef adı .'+fuz+' ile yaz)</div>';return;}
    if(!backendVar()){cikC.innerHTML='<div class="sonuc hata">sunucu yok — kontrol_paneli.py ile başlat</div>';return;}

    var oku=new FileReader();

      cikC.innerHTML='<div class="bosNot">GitHub\'a yükleniyor (şifresiz)… resimler/'+esc(ad)+' ('+kb(f.size)+')</div>';
      fetch('/api/gh/dosya-yukle',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ad:ad,icerik:b64})})
      .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
      .then(function(x){
        if(!x.ok||!x.j.ok)throw new Error((x.j&&x.j.hata)||('HTTP hata'));

        try{agacCiz();}catch(e){}
      })
      .catch(function(e){cikC.innerHTML='<div class="sonuc hata">şifresiz yükleme hatası: '+esc(e.message)+' (token: Ayarlar bölümünde kayıtlı olmalı — Contents: write)</div>';});
    };
    oku.readAsDataURL(f);
  };
}

/* ══════════ METİNLER ══════════ */
function renderMetinler(){
  var s=$('sahne');var M=D.metinler;
  var p=document.createElement('div');p.className='fPanel';s.appendChild(p);
  p.innerHTML='<h2>🌐 Metinler</h2><div class="altYazi">Site metinleri: grup → anahtar → <b>tek kaynak dil</b> yaz → 🔄. "aria" işaretlenen anahtarlar erişilebilirlik özniteliğine (title/aria-label) yazılır. <b>E185:</b> satırda yalnız anahtar + kaynak dil görünür; diğer diller satırdaki ▸ sayacıyla açılır (otomatik çeviri zaten doldurduğu için elle doldurma YOK). 🔄 satır, "Boşları Çevir" grup, "Tümünü Çevir" bütün grupları doldurur (dolular korunur).</div>';
  var bar=document.createElement('div');bar.className='sekmeBar';p.appendChild(bar);
  var gruplar=Object.keys(M);
  if(!metinGrup||gruplar.indexOf(metinGrup)<0)metinGrup=gruplar[0]||null;
  gruplar.forEach(function(g){
    var b=document.createElement('button');b.className='kck'+(g===metinGrup?' sec':'');
    b.textContent=g+' ('+Object.keys(M[g]).length+')';
    b.onclick=function(){metinGrup=g;sahneCiz();};
    bar.appendChild(b);
  });
  /* yeni grup */
  var ngi=document.createElement('input');ngi.type='text';ngi.placeholder='yeni grup';ngi.style.maxWidth='180px';
  var ngb=document.createElement('button');ngb.className='kck';ngb.textContent='+ Grup Ekle';
  ngb.onclick=function(){var v=(ngi.value||'').trim();if(!v)return;
    if(!M[v])M[v]={};ngi.value='';metinGrup=v;dokun();sahneCiz();};
  bar.appendChild(ngi);bar.appendChild(ngb);
  if(!metinGrup){var y=document.createElement('div');y.className='bosNot';y.textContent='(grup yok — Grup Ekle ile başla)';p.appendChild(y);return;}
  var G=M[metinGrup];
  var diller=dilListesi();
  var k1=document.createElement('div');k1.className='kutu';
  k1.innerHTML='<h3>'+esc(metinGrup)+'</h3><div class="ipucu">anahtar · kaynak dil (tr) · 🔄 boşları çevir · ▸ N/M dolu sayaç = tüm dilleri aç/kapa · aria · ✕</div>';p.appendChild(k1);
  var L=document.createElement('div');L.className='satirListe';k1.appendChild(L);
  function satCiz(){
    L.innerHTML='';
    Object.keys(G).forEach(function(an){
      var e=G[an];
      if(!e||typeof e!=='object'){e=G[an]={anahtar:an,degerler:{}};}
      if(!e.anahtar)e.anahtar=an;
      if(!e.degerler||typeof e.degerler!=='object')e.degerler={};
      /* ── E185: katlanır satır — [anahtar][kaynak][🔄][▸ N/M][aria][✕]; diller açılır ızgarada ── */
      function doluSay(){return diller.filter(function(dl){return sGuven(e.degerler[dl]).trim();}).length;}
      var sarmal=document.createElement('div');sarmal.className='mSatir';
      var r=document.createElement('div');r.className='oSatir';sarmal.appendChild(r);
      var k=document.createElement('input');k.type='text';k.value=sGuven(an);k.title='grup içindeki anahtar';k.style.maxWidth='190px';
      k.oninput=function(){var yeni=k.value.trim();if(!yeni||yeni===an)return;if(G[yeni]){k.style.borderColor='var(--kirmizi)';return;}k.style.borderColor='';
        if(metinAcik[an]){metinAcik[yeni]=true;delete metinAcik[an];}
        G[yeni]=e;delete G[an];e.anahtar=yeni;an=yeni;dokun();};
      r.appendChild(k);
      /* kaynak girişi: tr yoksa en, o da yoksa ilk dil — input her zaman BİLİNEN bir dili düzenler */
      var kd=diller.indexOf('tr')>=0?'tr':(diller.indexOf('en')>=0?'en':diller[0]);
      var d=document.createElement('input');d.type='text';d.placeholder=kd+' (kaynak)';d.value=sGuven(e.degerler[kd]);
      d.oninput=function(){e.degerler[kd]=d.value;dokun();};
      r.appendChild(d);
      var cb=document.createElement('button');cb.className='kck';cb.textContent='🔄';
      cb.title='Boş dilleri otomatik çevir (kaynak: tr → en → ilk dolu değer). Dolu alanlara DOKUNMAZ.';
      var rozet=document.createElement('button');rozet.className='kck';
      rozet.title='Tüm dilleri göster/gizle ('+diller.join(', ')+') — otomatik çeviri doldurduğu için elle doldurma genelde gerekmez';
      var izzgara=null;
      var satirTazele=function(){
        d.value=sGuven(e.degerler[kd]);
        rozet.textContent=(metinAcik[an]?'▾ ':'▸ ')+doluSay()+'/'+diller.length;
        if(izzgara){var ins=izzgara.querySelectorAll('input');diller.forEach(function(dl,ix){if(ins[ix])ins[ix].value=sGuven(e.degerler[dl]);});}
      };
      cb.onclick=function(){cevirSatir(e,diller,cb,satirTazele);};
      rozet.onclick=function(){metinAcik[an]=!metinAcik[an];if(izzgara)izzgara.style.display=metinAcik[an]?'grid':'none';satirTazele();};
      r.appendChild(cb);r.appendChild(rozet);
      var ar=document.createElement('label');ar.style.whiteSpace='nowrap';
      var ac=document.createElement('input');ac.type='checkbox';ac.checked=!!e.aria;
      ac.onchange=function(){if(ac.checked)e.aria=true;else delete e.aria;dokun();};
      ar.appendChild(ac);ar.appendChild(document.createTextNode(' aria'));
      r.appendChild(ar);
      r.appendChild(aracBtn('✕',function(){delete G[an];delete metinAcik[an];satCiz();dokun();},'tehlike'));
      izzgara=document.createElement('div');izzgara.className='dilIzgara';izzgara.style.display=metinAcik[an]?'grid':'none';
      diller.forEach(function(dl){
        var lb=document.createElement('label');
        var sp=document.createElement('span');sp.textContent=dl;lb.appendChild(sp);
        var di=document.createElement('input');di.type='text';di.placeholder=dl;di.value=sGuven(e.degerler[dl]);
        di.oninput=function(){e.degerler[dl]=di.value;dokun();};
        lb.appendChild(di);izzgara.appendChild(lb);
      });
      sarmal.appendChild(izzgara);
      rozet.textContent=(metinAcik[an]?'▾ ':'▸ ')+doluSay()+'/'+diller.length;
      L.appendChild(sarmal);
    });
  }
  satCiz();
  var yb=document.createElement('button');yb.className='kck';yb.textContent='+ Anahtar Ekle';
  yb.onclick=function(){var n='yeni_anahtar';var i=2;while(G[n])n='yeni_anahtar'+(i++);
    G[n]={anahtar:n,degerler:{}};satCiz();dokun();};

  var tb=document.createElement('button');tb.className='kck';tb.textContent='🔄 Boşları Çevir';
  tb.title='Bu gruptaki TÜM satırlarda boş dil alanlarını otomatik çevirir (dolu değerler korunur). Kaynak: her satırda tr → en → ilk dolu.';
  tb.onclick=function(){cevirGrup(G,diller,tb);};
  /* E185: BÜTÜN gruplar tek tıkla */
  var ha=document.createElement('button');ha.className='kck';ha.textContent='🔄 Tümünü Çevir';
  ha.title='BÜTÜN gruplardaki tüm satırlarda boş dil alanlarını otomatik çevirir (dolu değerler korunur). İlk doldurmada tek tık yeter.';
  ha.onclick=function(){cevirTumGruplar(M,diller,ha);};
  var ybK=document.createElement('div');ybK.className='yatay';ybK.style.marginTop='8px';
  ybK.appendChild(yb);ybK.appendChild(tb);ybK.appendChild(ha);k1.appendChild(ybK);
  var yip=document.createElement('div');yip.className='ipucu';yip.style.marginTop='8px';
  yip.textContent='Diller: '+diller.join(', ')+'. Elle doldurma GEREKMEZ: tek dili yaz (tr) → 🔄 (satır) / 🔄 Boşları Çevir (grup) / 🔄 Tümünü Çevir (hepsi). Otomatik çeviri Python sunucusu (/api/cevir: Google → MyMemory yedeği) üzerinden yapılır — doldurulmayan alan kalmaz.';
  k1.appendChild(yip);
}

/* ══════════ E183: OTOMATİK ÇEVİRİ (/api/cevir) ══════════ */
function cevirKaynakSec(e,diller){
  var oncelik=['tr','en'],i,v;
  for(i=0;i<oncelik.length;i++){v=sGuven((e.degerler||{})[oncelik[i]]).trim();if(v)return{dil:oncelik[i],metin:v};}
  for(i=0;i<diller.length;i++){v=sGuven((e.degerler||{})[diller[i]]).trim();if(v)return{dil:diller[i],metin:v};}
  return null;
}
function cevirCagir(metin,kaynak,hedef){
  return fetch('/api/cevir',{method:'POST',cache:'no-store',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({metin:metin,kaynak:kaynak,hedef:hedef})})
  .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
  .then(function(x){
    if(!x.ok)throw new Error((x.j&&x.j.mesaj)||('HTTP '+x.ok));
    if(!x.j||!x.j.tamam)throw new Error((x.j&&x.j.mesaj)||'çeviri boş');
    return String(x.j.ceviri||'');
  });
}
function cevirSatir(e,diller,btn,tazele){
  var k=cevirKaynakSec(e,diller);
  if(!k){btn.textContent='kaynak yok';setTimeout(function(){btn.textContent='🔄';},2200);return;}
  var hedefler=diller.filter(function(dl){return dl!==k.dil&&!sGuven(e.degerler[dl]).trim();});
  if(!hedefler.length){btn.textContent='boş yok ✓';setTimeout(function(){btn.textContent='🔄';},2200);return;}
  btn.disabled=true;
  var yap=0,hata=0;
  var zincir=Promise.resolve();
  hedefler.forEach(function(dl){
    zincir=zincir.then(function(){
      return cevirCagir(k.metin,k.dil,dl)
      .then(function(c){e.degerler[dl]=c;yap++;btn.textContent=dl+' ✓';dokun();})
      .catch(function(){hata++;btn.textContent=dl+' ✗';});
    }).then(function(){return new Promise(function(z){setTimeout(z,150);});});
  });
  zincir.then(function(){
    /* satır girişlerini yerinde tazele — E185: katlanır ızgarada callback ile; eski düz satırda parentNode */
    if(tazele)tazele();
    else{var inp=btn.parentNode?btn.parentNode.querySelectorAll('input[type=text]'):[];
      diller.forEach(function(dl,ix){if(inp[ix+1])inp[ix+1].value=sGuven(e.degerler[dl]);});}
    btn.disabled=false;
    btn.textContent=hata?('🔄 '+yap+'✓/'+hata+'✗'):('✓ '+yap);
    setTimeout(function(){btn.textContent='🔄';},2600);
    dokun();
  });
}
function cevirGrup(G,diller,btn){
  var sira=[],toplam=0;
  Object.keys(G).forEach(function(an){
    var e=G[an];if(!e||typeof e!=='object'||!e.degerler)return;
    var k=cevirKaynakSec(e,diller);if(!k)return;
    var h=diller.filter(function(dl){return dl!==k.dil&&!sGuven(e.degerler[dl]).trim();});
    if(h.length){sira.push({e:e,kaynak:k,hedefler:h});toplam+=h.length;}
  });
  if(!sira.length){btn.textContent='boş yok ✓';setTimeout(function(){btn.textContent='🔄 Boşları Çevir';},2400);return;}
  btn.disabled=true;
  var yap=0,hata=0;
  btn.textContent='0/'+toplam;
  var zincir=Promise.resolve();
  sira.forEach(function(sr){
    zincir=zincir.then(function(){
      return sr.hedefler.reduce(function(p,dl){
        return p.then(function(){
          return cevirCagir(sr.kaynak.metin,sr.kaynak.dil,dl)
          .then(function(c){sr.e.degerler[dl]=c;yap++;dokun();})
          .catch(function(){hata++;});
        });
      },Promise.resolve())
      .then(function(){btn.textContent=yap+'/'+toplam;return new Promise(function(z){setTimeout(z,120);});});
    });
  });
  zincir.then(function(){
    btn.disabled=false;
    btn.textContent=hata?('🔄 '+yap+'✓/'+hata+'✗'):('✓ '+yap+' çeviri');
    setTimeout(function(){btn.textContent='🔄 Boşları Çevir';},3000);
    dokun();sahneCiz();
  });
}
/* ── E185: BÜTÜN grupları tek tıkla çevir — ilk doldurmada tek düğme yeter ── */
function cevirTumGruplar(M,diller,btn){
  var sira=[],toplam=0;
  Object.keys(M).forEach(function(gn){
    var G=M[gn];
    if(!G||typeof G!=='object')return;
    Object.keys(G).forEach(function(an){
      var e=G[an];if(!e||typeof e!=='object'||!e.degerler)return;
      var k=cevirKaynakSec(e,diller);if(!k)return;
      var h=diller.filter(function(dl){return dl!==k.dil&&!sGuven(e.degerler[dl]).trim();});
      if(h.length){sira.push({e:e,kaynak:k,hedefler:h});toplam+=h.length;}
    });
  });
  if(!sira.length){btn.textContent='boş yok ✓';setTimeout(function(){btn.textContent='🔄 Tümünü Çevir';},2400);return;}
  if(toplam>40&&!confirm(toplam+' dil alanı çevrilecek — kaynak sayısına göre birkaç dakika sürebilir.\nDevam edilsin mi?'))return;
  btn.disabled=true;
  var yap=0,hata=0;
  btn.textContent='0/'+toplam;
  var zincir=Promise.resolve();
  sira.forEach(function(sr){
    zincir=zincir.then(function(){
      return sr.hedefler.reduce(function(p,dl){
        return p.then(function(){
          return cevirCagir(sr.kaynak.metin,sr.kaynak.dil,dl)
          .then(function(c){sr.e.degerler[dl]=c;yap++;dokun();})
          .catch(function(){hata++;});
        });
      },Promise.resolve())
      .then(function(){btn.textContent=yap+'/'+toplam;return new Promise(function(z){setTimeout(z,120);});});
    });
  });
  zincir.then(function(){
    btn.disabled=false;
    btn.textContent=hata?('🔄 '+yap+'✓/'+hata+'✗'):('✓ '+yap+' çeviri');
    setTimeout(function(){btn.textContent='🔄 Tümünü Çevir';},3000);
    dokun();sahneCiz();
  });
}

/* ══════════ EKSİKLER (otomatik hesap) ══════════ */
function eksikleriHesapla(){
  var e={urunsuzOyunlar:[],clientBaslikYok:[],trailerKismiEksik:{},not:'Otomatik: ürünü olmayan oyunlar, client başlığı boş olan ürünler, trailer alanı eksik ürünler.'};
  (D.oyunlar||[]).forEach(function(o){
    if(!(o.urunler||[]).length)e.urunsuzOyunlar.push(o.ad);
    (o.urunler||[]).forEach(function(u){
      if(!sGuven((u.client||{}).baslik))e.clientBaslikYok.push(u.ad);
      var t=u.trailer||{},eks=[];
      if(!sGuven(t.term))eks.push('trailer-term');
      if(!sGuven(t.aciklama))eks.push('trailer-desc');
      if(eks.length)e.trailerKismiEksik[u.ad]=eks;
    });
  });
  if(!e.trailerKismiEksik||!Object.keys(e.trailerKismiEksik).length)delete e.trailerKismiEksik;
  return e;
}

  p.innerHTML='<h2>🧩 Eksikler</h2><div class="altYazi">JSON\'daki "eksikler" bölümü her kayıtta otomatik hesaplanır ve güncellenir — elle düzenlemeye gerek yok.</div>';
  var k=document.createElement('div');k.className='kutu';p.appendChild(k);

    '<div class="sonuc '+(e.clientBaslikYok.length?'uyari':'ok')+'">Client başlığı boş ürünler: <b>'+esc(e.clientBaslikYok.join(', ')||'yok')+'</b></div>'+
    '<div class="sonuc '+(Object.keys(e.trailerKismiEksik||{}).length?'uyari':'ok')+'">Trailer alanı eksik ürünler: <b>'+esc(Object.keys(e.trailerKismiEksik||{}).join(', ')||'yok')+'</b></div>';
  var b=document.createElement('button');b.className='kck';b.textContent='Eksikleri Şimdi JSON\'a Yaz';

function sonucYaz(kapsa,metin,tur){
  var d=document.createElement('div');d.className='sonuc '+(tur||'ok');d.textContent=metin;

}

<script>
"use strict";
/* ══════════ GITHUB ══════════ */
function ghCfg(){
  return {sahip:$('ghSahip').value.trim(),repo:$('ghRepo').value.trim(),
    dal:$('ghDal').value.trim()||'main',yol:$('ghYol').value.trim()||'icerik/site_icerik.json'};
}
function ghCfgKaydet(){
  var c=ghCfg();
  try{localStorage.setItem(LS_CFG,JSON.stringify(c));}catch(e){}
  try{localStorage.setItem('epin_gh_taban','https://raw.githubusercontent.com/'+c.sahip+'/'+c.repo+'/'+c.dal);}catch(e){}
  try{var t=$('ghToken').value.trim();if(t)localStorage.setItem(LS_TOKEN,t);}catch(e){}
  ghSonuc('Ayarlar kaydedildi (token bu tarayıcıda kalır; site çekim tabanı da güncellendi).','ok');
}
function ghSonuc(metin,tur){
  $('ghSonuc').innerHTML='<div class="sonuc '+(tur||'ok')+'">'+esc(metin)+'</div>';
  /* E184: GitHub ayarları paneli kapalıyken sonuç/hata üst çipte de görünsün — mesaj görünmez alana düşmesin */
  try{
    var ga=$('githubAlani');
    if(ga&&ga.style.display==='none'){
      var r=(tur||'ok'),rk=(r==='hata')?'#ff9d95':((r==='uyari')?'#e7c56a':'#7ee2a0');
      $('durumCip').innerHTML='<span style="color:'+rk+'">'+esc(metin)+'</span>';
    }
  }catch(e){}
}
function ghRawUrl(){
  var c=ghCfg();
  return 'https://raw.githubusercontent.com/'+c.sahip+'/'+c.repo+'/'+c.dal+'/'+c.yol;
}
function ghApiUrl(){
  var c=ghCfg();
  return 'https://api.github.com/repos/'+c.sahip+'/'+c.repo+'/contents/'+c.yol+'?ref='+c.dal;
}
function ghCek(otomatik){
  if(!ghCfg().sahip||!ghCfg().repo){if(!otomatik)ghSonuc('GitHub ayarları eksik — Ayarlar bölümünü doldurun.','hata');return;}
  ghSonuc((otomatik?'Açılışta otomatik taze çekim… ':'GitHub\'dan TAZE çekiliyor… ')+'(E183: önbellek kırıcı aktif — tarayıcı + raw CDN eski kopya kullanmaz)');
  fetch('/api/gh/icerik?t='+Date.now(),{cache:'no-store'})
  .then(function(r){if(!r.ok)throw new Error('BEK-'+r.status);return r.text();})
  .catch(function(){return fetch(ghRawUrl()+'?t='+Date.now(),{cache:'no-store'})
  .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text();});})
  .then(function(t){
    var j=null;try{j=JSON.parse(t);}catch(e){throw new Error('JSON parse hatası: '+e);}
    if(!j||j.sema!=='epinsitesi-icerik')throw new Error('sema "epinsitesi-icerik" değil — bu dosya site içeriği değil.');
    D=normalize(j);var yuks=pngYukselt(D);metinGrup=null;
    secim={tur:'oyun',oyun:0,urun:0};
    agacAcik={0:true};   /* E183: ilk oyunun ürünleri açık gelsin */
    agacArama='';var ai=$('agacArama');if(ai)ai.value='';var at=$('agacAramaTemizle');if(at)at.style.display='none';
    temizleModu=false;   /* E184: temizle askısı bitti — taze veri taslak olarak yazılabilir */
    dokun();sahneCiz();agacCiz();
    ghSonuc((otomatik?'Açılışta otomatik: ':'')+'GitHub\'dan TAZE yüklendi ('+t.length+' bayt'+(j.zaman?(' · içerik zamanı: '+new Date(j.zaman*1000).toLocaleString()):'')+(yuks?(' · ⚠ '+yuks+' eski .png değer otomatik <taban>_rkm.js yapıldı — GitHub\'da png yok'):'')+') — güncel veri bu.','ok');
  })
  .catch(function(e){temizleModu=false;ghSonuc('Çekme hatası: '+e.message,'hata');});   /* E184: askı kalkar, hata çipte görünür */
}
function ghYukle(){
  if(!D){ghSonuc('İçerik yok — önce yükle veya oluştur.','hata');return;}
  var t=$('ghToken').value.trim();
  if(!t){ghSonuc('Token boş — Ayarlar bölümüne github_pat_… yazın.','hata');return;}
  var c=ghCfg();
  if(!c.sahip||!c.repo){ghSonuc('GitHub ayarları eksik.','hata');return;}
  /* E174 dersi: her push'ta zaman otomatik tazelenir — site "eski veri" sayıp reddetmesin */
  D.zaman=Math.floor(Date.now()/1000);
  D.olusturma=new Date().toISOString();
  if(D.eksikler)D.eksikler=eksikleriHesapla();
  ghSonuc('Push ediliyor (zaman '+D.zaman+' tazelendi)…');
  var govde=JSON.stringify(D,null,2);
  fetch(ghApiUrl(),{headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+t}})
  .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
  .then(function(x){
    var putGovde={message:'site_icerik.json — M2God kontrol paneli (E193) '+new Date().toISOString(),
      content:btoa(unescape(encodeURIComponent(govde))),branch:c.dal};
    if(x.ok&&x.j&&x.j.sha)putGovde.sha=x.j.sha;
    return fetch('https://api.github.com/repos/'+c.sahip+'/'+c.repo+'/contents/'+c.yol,{
      method:'PUT',
      headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+t,'Content-Type':'application/json'},
      body:JSON.stringify(putGovde)});
  })
  .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
  .then(function(x){
    if(!x.ok){var ms=(x.j&&x.j.message)||('HTTP '+x.ok);throw new Error(ms);}
    ghSonuc('Push tamam: '+(x.j.commit&&x.j.commit.sha?x.j.commit.sha.slice(0,7):'commit')+' — raw CDN ~5 dk içinde güncellenir.','ok');
    dokun();
  })
  .catch(function(e){ghSonuc('Yükleme hatası: '+e.message+' (token izinleri: Contents: write olmalı; depo erişimi doğru mu?)','hata');});
}
function dosyaYukleFn(dosya){
  var oku=new FileReader();
  oku.onload=function(){
    try{
      var j=JSON.parse(String(oku.result));
      if(!j||j.sema!=='epinsitesi-icerik')throw new Error('sema "epinsitesi-icerik" değil');
      D=normalize(j);var yDosya=pngYukselt(D);metinGrup=null;secim={tur:'oyun',oyun:0,urun:0};
      agacAcik={0:true};   /* E183 */
      dokun();sahneCiz();agacCiz();
      sonucYaz($('sahne'),'Dosyadan yüklendi: '+dosya.name+(yDosya?(' · ⚠ '+yDosya+' eski .png değer otomatik <taban>_rkm.js yapıldı (şifreli karşılığı GitHub\'da var)'):''),'ok');
    }catch(e){alert('Dosya yüklenemedi: '+e.message);}
  };
  oku.readAsText(dosya);
}

/* ══════════ DOĞRULAMA ══════════ */
function dogrula(){
  if(!D){alert('İçerik yok — önce yükle veya oluştur.');return;}
  var s=$('sahne');s.innerHTML='';
  var p=document.createElement('div');p.className='fPanel';
  p.innerHTML='<h2>✓ Doğrulama</h2><div class="altYazi">Üretilen JSON\'un site tarafından okunabilirliği kontrol edilir.</div>';
  s.appendChild(p);
  var R=[];
  function ekle(tur,m){R.push([tur,m]);}
  ekle(D.sema==='epinsitesi-icerik'?'ok':'hata','sema: '+sGuven(D.sema));
  ekle(nInt(D.zaman)>0?'ok':'hata','zaman: '+sGuven(D.zaman));
  ekle((D.oyunlar||[]).length?'ok':'uyari','oyunlar: '+(D.oyunlar||[]).length+' adet');
  (D.oyunlar||[]).forEach(function(o,i){
    if(!sGuven(o.ad))ekle('hata','oyun['+i+']: ad boş');
    (o.urunler||[]).forEach(function(u,j){
      var yol='oyun['+sGuven(o.ad)+'] ürün['+sGuven(u.ad)+']';
      if(!sGuven(u.ad))ekle('hata',yol+': ad boş');
      if(!(u.fiyat&&nSay(u.fiyat.tutar)>0)&&!(u.paketler||[]).length)
        ekle('uyari',yol+': fiyat 0 ve paket yok');
      (u.paketler||[]).forEach(function(pk,k){
        if(!sGuven(pk.ad)||nSay(pk.gun)<=0||nSay(pk.fiyat)<=0)
          ekle('hata',yol+' paket['+k+']: ad/gün/fiyat eksik');
      });
      if(u.trailer&&!sGuven(u.trailer.term)&&!sGuven(u.trailer.aciklama))
        ekle('uyari',yol+': trailer term/desc boş');
    });
  });
  var vids=(D.videolar&&D.videolar.videolar)||[];
  ekle(vids.length?'ok':'uyari','videolar: '+vids.length+' adet');
  vids.forEach(function(v,i){if(!sGuven(v.link))ekle('uyari','video['+i+'] ('+sGuven(v.baslik)+'): link boş — site placeholder gösterir');});
  var grp=Object.keys(D.metinler||{});var anahtarSay=0;
  grp.forEach(function(g){anahtarSay+=Object.keys(D.metinler[g]).length;});
  ekle('ok','metinler: '+grp.length+' grup / '+anahtarSay+' anahtar');
  var e=D.eksikler||{};
  if(e.urunsuzOyunlar&&e.urunsuzOyunlar.length)ekle('uyari','eksikler.urunsuzOyunlar: '+e.urunsuzOyunlar.join(', '));
  R.forEach(function(x){
    var d=document.createElement('div');d.className='sonuc '+x[0];d.textContent=x[1];p.appendChild(d);
  });
  var oz=document.createElement('div');oz.className='sonuc ok';
  oz.textContent='ÖZET: '+R.filter(function(x){return x[0]==='ok';}).length+' ok · '+
    R.filter(function(x){return x[0]==='uyari';}).length+' uyarı · '+
    R.filter(function(x){return x[0]==='hata';}).length+' hata';
  p.insertBefore(oz,p.children[1]||null);
}

  /* ── E184: verileri temizle — taslak GERİ DİRİLMEZ (yalnız YEREL, GitHub'a dokunmaz) ──

  /* taslak var mı? */
  var tas=null;
